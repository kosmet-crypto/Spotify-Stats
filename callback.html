<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Слушаоница · пријава</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111214; color: #f4f4f2;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  @media (prefers-color-scheme: light) { body { background: #f4f4f1; color: #121212; } }
  main { max-width: 360px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  a.btn { display: inline-block; background: #1ed48a; color: #06140d; font-weight: 700; padding: 12px 22px; border-radius: 12px; text-decoration: none; }
  p { margin: 0; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1 style="margin:0;font-size:22px">Слушаоница</h1>
  <p id="msg">Враћам те у апликацију…</p>
  <a id="go" class="btn" href="#" style="display:none">Врати се у апликацију</a>
</main>
<script>
// Spotify sends the login back here (an https page, as Spotify requires). The state starts with
// "a" when the login began in the Android app and "w" in the web version.
(function () {
  var q = location.search;
  var state = new URLSearchParams(q).get('state') || '';
  var go = document.getElementById('go');
  if (state.charAt(0) === 'a') {
    var target = 'intent://callback' + q + '#Intent;scheme=slusaonica;package=app.slusaonica;end';
    go.href = target;
    go.style.display = '';
    document.getElementById('msg').textContent = 'Ако се апликација не отвори сама, тапни дугме.';
    location.href = target;
  } else {
    location.replace('./' + q);
  }
})();
</script>
</body>
</html>
