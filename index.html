/** Resolves the stored period description into {from, to, label, days}. */
function resolvePeriod(p) {
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  switch (p.kind) {
    case 'year':
      return { from: new Date(p.year, 0, 1).getTime(), to: new Date(p.year + 1, 0, 1).getTime(), label: p.year + '.', short: String(p.year) };
    case 'month':
      return { from: new Date(p.year, p.month, 1).getTime(), to: new Date(p.year, p.month + 1, 1).getTime(), label: MONTHS[p.month] + ' ' + p.year + '.', short: MONTHS_SHORT[p.month] + ' ' + p.year };
    case 'last': {
      const from = todayStart - (p.days - 1) * DAY;
      return { from, to: todayStart + DAY, label: 'последњих ' + p.days + ' дана', short: p.days + ' дана' };
    }
    case 'custom': {
      const from = new Date(p.from + 'T00:00').getTime(), to = new Date(p.to + 'T00:00').getTime() + DAY;
      return { from, to, label: fmtDate(from) + ' – ' + fmtDate(to - DAY), short: 'прилагођено' };
    }
    default:
      return { from: -Infinity, to: Infinity, label: 'све време', short: 'Све' };
  }
}
function dataYears() {
  const c = Stats.cols();
  if (!c.n) return [];
  const y0 = new Date(c.T[0]).getFullYear(), y1 = new Date(c.T[c.n - 1]).getFullYear();
  const out = [];
  for (let y = y1; y >= y0; y--) out.push(y);
  return out;
}

function periodBar() {
  const p = App.period;
  const bar = h('div.chips');
  const chip = (label, on, fn) => bar.appendChild(h('button.chip' + (on ? '.on' : ''), { type: 'button', onclick: fn }, label));
  chip('Све', p.kind === 'all', () => App.setPeriod({ kind: 'all' }));
  chip('30 дана', p.kind === 'last' && p.days === 30, () => App.setPeriod({ kind: 'last', days: 30 }));
  for (const y of dataYears()) chip(String(y), p.kind === 'year' && p.year === y, () => App.setPeriod({ kind: 'year', year: y }));
  const special = (p.kind === 'month' || p.kind === 'custom' || (p.kind === 'last' && p.days !== 30));
  chip(special ? resolvePeriod(p).short + ' ▾' : 'Још ▾', special, () => periodSheet());
  requestAnimationFrame(() => { const on = $('.chip.on', bar); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); });
  return bar;
}

function periodSheet() {
  const years = dataYears();
  const body = h('div.sheet-body');
  const close = sheet('Изабери период', body);
  const pick = p => { close(); App.setPeriod(p); };
  body.appendChild(h('div.btn-grid',
    [7, 90, 180, 365].map(d => btn('Последњих ' + d + ' дана', () => pick({ kind: 'last', days: d }), 'ghost'))));
  if (years.length) {
    const ySel = h('select', years.map(y => h('option', { value: y }, String(y))));
    const mSel = h('select', MONTHS.map((m, i) => h('option', { value: i }, m)));
    const now = new Date();
    mSel.value = String(now.getMonth());
    body.appendChild(h('div.field', h('label', 'Месец'), h('div.inline', mSel, ySel,
      btn('Прикажи', () => pick({ kind: 'month', year: +ySel.value, month: +mSel.value })))));
  }
  const f = h('input', { type: 'date', value: isoDate(Date.now() - 30 * DAY) });
  const t = h('input', { type: 'date', value: isoDate(Date.now()) });
  body.appendChild(h('div.field', h('label', 'Од – до'), h('div.inline', f, t,
    btn('Прикажи', () => { if (f.value && t.value && f.value <= t.value) pick({ kind: 'custom', from: f.value, to: t.value }); }))));
}

/** Picks the chart bucket that gives a readable number of columns for a period. */
function autoBucket(i0, i1) {
  const c = Stats.cols();
  if (i1 <= i0) return 'month';
  const span = c.DAY[i1 - 1] - c.DAY[i0];
  if (span <= 62) return 'day';
  if (span <= 370) return 'week';
  if (span <= 12 * 366) return 'month';
  return 'year';
}

const REASON_LABELS = {
  trackdone: 'песма се завршила', fwdbtn: 'дугме „следећа“', backbtn: 'дугме „претходна“', endplay: 'заустављено',
  logout: 'одјава', remote: 'даљинско управљање', clickrow: 'клик на песму', playbtn: 'дугме „пусти“',
  appload: 'покретање апликације', trackerror: 'грешка', unexpected_exit: 'неочекивани излаз',
  unexpected_exit_while_paused: 'излаз током паузе', popup: 'искачући прозор', uriopen: 'отворен линк',
  unknown: 'непознато', switched_to_audio: 'прелаз на звук', switched_to_video: 'прелаз на видео', '': 'непознато',
};
function reasonLabel(r) { return REASON_LABELS[r] || r; }

function flagOf(code) {
  if (!code || code.length !== 2) return '';
  return String.fromCodePoint(...[...code.toUpperCase()].map(c => 0x1f1e6 + c.charCodeAt(0) - 65));
}
const regionNames = (() => { try { return new Intl.DisplayNames(['sr-Cyrl'], { type: 'region' }); } catch (e) { return null; } })();
function countryName(code) {
  try { return (regionNames && regionNames.of(code)) || code; } catch (e) { return code; }
}

Views.top = function () {

    listWrap.appendChild(growList(shown, r => entityRow(st.kind, r.x, r.rank, max, st.metric), 50));
  };
  q.addEventListener('input', debounce(() => { App.state.top.q = q.value; renderList(); }, 200));
  v.appendChild(card(null,
    seg([['track', 'Песме'], ['artist', 'Извођачи'], ['album', 'Албуми']], st.kind, k => App.setSub('top', { kind: k })),
    h('div.card-head', seg([['plays', 'Слушања'], ['ms', 'Минути']], st.metric, m => App.setSub('top', { metric: m })), q),

function forgottenFavorites() {
  return Stats.memo('forgotten', () => {
    const c = Stats.cols();
    const top = Stats.top(0, c.n, 'track').slice(0, 1500);
    const out = [];
    const limit = Date.now() - 365 * DAY;
    for (const x of top) {
      if (x.plays < 10) break;
      const idx = Stats.entityPlays('track', x.id);
      const last = c.T[idx[idx.length - 1]];
      if (last < limit) out.push({ id: x.id, plays: x.plays, last });
    }
    return out;
  });
}

/** Monthly plays of one entity over its whole history. */
function entityMonthly(kind, id) {
  const c = Stats.cols(), idx = Stats.entityPlays(kind, id);
  if (!idx.length) return null;
  const k0 = monthKeyOfDay(c.DAY[idx[0]]), k1 = monthKeyOfDay(c.DAY[idx[idx.length - 1]]);
  const vals = new Array(k1 - k0 + 1).fill(0);
  for (const i of idx) vals[monthKeyOfDay(c.DAY[i]) - k0] += c.CNT[i];
  const keys = vals.map((x, j) => k0 + j);
  return {
    values: vals, labels: keys.map(k => monthKeyLabel(k)),
    short: keys.map(k => k % 12 === 0 ? String(Math.floor(k / 12)) : MONTHS_SHORT[k % 12]),
  };
}

function entityTotals(kind, id, i0, i1) {
  const c = Stats.cols(), idx = Stats.entityPlays(kind, id);
  let plays = 0, ms = 0, pPlays = 0, pMs = 0, json = 0, skip = 0;
  const fwd = Store.reasons.indexOf('fwdbtn');
  const hours = new Array(24).fill(0);
  const days = new Map();
  for (const i of idx) {
    plays += c.CNT[i]; ms += c.MS[i];
    if (i >= i0 && i < i1) { pPlays += c.CNT[i]; pMs += c.MS[i]; }
    hours[c.HOUR[i]] += c.CNT[i];
    if (c.CNT[i]) days.set(c.DAY[i], (days.get(c.DAY[i]) || 0) + 1);
    if (c.F[i] & SRC_JSON) { json++; if ((c.F[i] & F_SKIPPED) || (fwd > 0 && c.RE[i] === fwd)) skip++; }
  }
  let firstI = -1, lastI = -1;
  for (const i of idx) if (c.CNT[i]) { if (firstI < 0) firstI = i; lastI = i; }
  const topDays = [...days].sort((a, b) => b[1] - a[1]).slice(0, 5);
  return {
    plays, ms, pPlays, pMs, json, skip, hours, topDays, daysCount: days.size,
    first: firstI >= 0 ? c.T[firstI] : 0, last: lastI >= 0 ? c.T[lastI] : 0,
  };
}

function detailActions(trackId) {
  const t = Store.tracks[trackId];
  const row_ = h('div.actions');
  row_.appendChild(busyBtn('▶ Пусти', async () => {
    if (!SP.loggedIn()) { const u = t.uri; if (u) openExternal(spotifyOpenUrl(u)); else toast('Повежи Spotify у подешавањима', true); return; }
    const uri = await SP.resolveTrack(trackId);
    if (!uri) { toast('Песма није нађена на Spotify-у', true); return; }
    if (await SP.playTrack(uri)) toast('Пушта се');
  }));
  row_.appendChild(busyBtn('Отвори у Spotify-у', async () => {
    const uri = t.uri || (SP.loggedIn() ? await SP.resolveTrack(trackId) : null);
    openExternal(uri ? spotifyOpenUrl(uri) : 'https://open.spotify.com/search/' + encodeURIComponent(t.n + ' ' + Store.artists[t.a].n));
  }, 'ghost'));
  if (SP.loggedIn()) {
    const heart = busyBtn('♡', async () => {
      const uri = await SP.resolveTrack(trackId);
      if (!uri) return;
      const on = heart.dataset.on !== '1';
      await SP.save([uri], on);
      heart.dataset.on = on ? '1' : '0';
      heart.textContent = on ? '♥' : '♡';
      toast(on ? 'Додато у лајковане' : 'Уклоњено из лајкованих');
    }, 'ghost icon-text');
    heart.title = 'Лајкуј на Spotify-у';
    if (t.uri) SP.isSaved([t.uri]).then(r => { if (r[0]) { heart.dataset.on = '1'; heart.textContent = '♥'; } }).catch(() => {});
    row_.appendChild(heart);
  }
  return row_;
}

async function artistSpotifyId(id) {
  const a = Store.artists[id];
  if (a.sid) return a.sid;
  const tr = Store.tracks.findIndex(t => t.a === id && t.uri);
  if (tr >= 0) {
    const j = await SP.api('/tracks/' + spotifyIdFromUri(Store.tracks[tr].uri));
    if (j.artists && j.artists[0]) { a.sid = j.artists[0].id; Covers.dirty(); return a.sid; }
  }
  const r = await SP.api('/search?' + new URLSearchParams({ q: a.n, type: 'artist', limit: '5' }));
  const hit = r.artists && r.artists.items.find(x => normArtist(x.name) === normArtist(a.n));
  if (hit) { a.sid = hit.id; Covers.dirty(); }
  return a.sid || null;
}

function albumDetail(id) {

function dayDetail(day) {
  const c = Stats.cols();
  const from = dayStart(day), to = dayStart(day + 1);
  const i0 = lowerBound(c.T, from - 6 * 3600000), i1 = lowerBound(c.T, to + 6 * 3600000);
  const v = h('div.view');
  const rows = [];
  let ms = 0, plays = 0;
  for (let i = i0; i < i1; i++) {
    if (c.DAY[i] !== day) continue;
    ms += c.MS[i]; plays += c.CNT[i];
    const d = new Date(c.T[i]);
    const tid = c.TR[i];
    rows.push(row({
      title: entityName('track', tid), sub: entitySub('track', tid) + (c.CNT[i] ? '' : ' · прескочено'),
      value: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'),
      kind: 'track', id: tid, onClick: () => App.openDetail('track', tid),
    }));
  }
  v.appendChild(tiles(tile('Слушања', fmtInt(plays)), tile('Време', fmtDur(ms))));
  v.appendChild(card(null, rows.length ? growList(rows, r => r, 60) : empty('Тог дана ниси слушао музику.')));
  return v;
}

  const st = App.sub('sptop', { range: 'short_term', type: 'tracks' });

        local = aId !== undefined ? Store.trackByKey.get(aId + '|' + normTitle(it.name)) : undefined;
      } else {
        local = Store.artistByKey.get(normArtist(it.name));
      }

      const img = kind === 'track' ? (it.album && it.album.images && it.album.images.length ? it.album.images[it.album.images.length - 1].url : '')
        : (it.images && it.images.length ? it.images[it.images.length - 1].url : '');
      return h('div.row' + (local !== undefined ? '.click' : ''), { onclick: local !== undefined ? () => App.openDetail(kind, local) : null },
        h('span.rank', String(k + 1)),
        h('span.cover' + (kind === 'artist' ? '.round' : ''), img ? h('img', { src: img, alt: '', loading: 'lazy' }) : h('span.cover-txt', initials(it.name))),

  return c;
}

/* ---------- liked songs (B1, B3) ---------- */

function likedCard() {
  const box = h('div');
  const c = card('Лајковане песме', box);
  const draw = () => {
    clear(box);
    const liked = SpCache.liked;
    if (!liked) {
      box.appendChild(cardNote('Колико и када лајкујеш, шта си лајковао а не слушаш, и шта највише слушаш а ниси лајковао.'));
      const status = h('span.muted');
      box.appendChild(h('div.btn-row', busyBtn('Учитај лајковане', async () => {
        SpCache.liked = await SP.all('/me/tracks?limit=50', 20000, (n, total) => { status.textContent = n + ' / ' + (total || '?'); });
        draw();
      }), status));
      return;
    }
    const localOf = it => {
      const t = it.track;
      const aId = Store.artistByKey.get(normArtist(t.artists && t.artists[0] ? t.artists[0].name : ''));
      return aId !== undefined ? Store.trackByKey.get(aId + '|' + normTitle(t.name)) : undefined;
    };
    const counts = liked.map(it => { const l = localOf(it); return l !== undefined ? Stats.entityPlays('track', l).length : 0; });
    const byMonth = new Map();
    for (const it of liked) {
      const d = new Date(it.added_at);
      const k = d.getFullYear() * 12 + d.getMonth();
      byMonth.set(k, (byMonth.get(k) || 0) + 1);
    }
    const ks = [...byMonth.keys()];
    const k0 = Math.min(...ks), k1 = Math.max(...ks);
    const keys = [];
    for (let k = k0; k <= k1; k++) keys.push(k);
    const oldest = liked.reduce((a, b) => (a && a.added_at < b.added_at ? a : b), null);
    box.appendChild(tiles(
      tile('Лајкованих', fmtInt(liked.length)),
      tile('Први лајк', oldest ? fmtDate(Date.parse(oldest.added_at)) : '–', oldest ? oldest.track.name : null),
      tile('Никад слушане', fmtInt(counts.filter(x => x === 0).length)),
    ));
    const el = h('div');
    box.appendChild(h('h4', 'Лајкови по месецима'));
    box.appendChild(el);
    requestAnimationFrame(() => chartSeries(el, {
      labels: keys.map(k => k % 12 === 0 ? String(Math.floor(k / 12)) : MONTHS_SHORT[k % 12]),
      full: keys.map(k => monthKeyLabel(k)), values: keys.map(k => byMonth.get(k) || 0), fmt: x => fmtInt(x) + ' лајкова', color: COLORS[4],
    }));
    const unheard = liked.map((it, i) => ({ it, n: counts[i] })).filter(x => x.n <= 1);
    box.appendChild(h('h4', 'Лајковане, а (скоро) неслушане'));
    box.appendChild(unheard.length ? growList(unheard, x => spotifyTrackRow(x.it.track, { sub: 'лајк ' + fmtDate(Date.parse(x.it.added_at)) }), 10) : empty('Све лајковане слушаш.'));
    // Most played, not liked.
    const likedUris = new Set(liked.map(it => it.track.uri));
    const likedKeys = new Set(liked.map(it => trackKey(it.track.artists && it.track.artists[0] ? it.track.artists[0].name : '', it.track.name)));
    const top = Stats.top(0, Stats.cols().n, 'track').filter(x => {
      const t = Store.tracks[x.id];
      return !(t.uri && likedUris.has(t.uri)) && !likedKeys.has(trackKey(Store.artists[t.a].n, t.n));
    }).slice(0, 50);
    box.appendChild(h('h4', 'Највише слушаш, а ниси лајковао'));
    box.appendChild(growList(top, (x, k) => {
      const heart = busyBtn('♡', async () => {
        const uri = await SP.resolveTrack(x.id);
        if (!uri) { toast('Није нађено на Spotify-у', true); return; }
        await SP.save([uri], true);
        heart.textContent = '♥';
        heart.disabled = true;
        toast('Лајковано');
      }, 'ghost icon');
      const r = entityRow('track', x, k + 1, top[0].plays, 'plays');
      r.appendChild(heart);
      heart.addEventListener('click', e => e.stopPropagation());
      return r;
    }, 10));
  };
  draw();
  return c;
}

/* ---------- playlist from stats (V2, V3, V4) ---------- */

const GEN_SOURCES = [
  ['top', 'Топ песме периода'],
  ['new', 'Откривања периода'],
  ['obs', 'Опсесије периода'],
  ['comeback', 'Повратници'],
  ['forgotten', 'Заборављени фаворити'],
  ['morning', 'Јутарња музика (6–11ч)'],
  ['night', 'Ноћна музика (22–4ч)'],
];

function generatorTracks(source, n) {
  const P = App.range();
  const [i0, i1] = Stats.range(P);
  let ids;
  if (source === 'top') ids = Stats.top(i0, i1, 'track').map(x => x.id);
  else if (source === 'new') ids = Stats.discoveries(i0, i1).newTracks.map(x => x.id);
  else if (source === 'obs') ids = Stats.obsessions(i0, i1).map(x => x.id);
  else if (source === 'comeback') ids = Stats.comebacks(i0, i1).map(x => x.id);
  else if (source === 'forgotten') ids = forgottenFavorites().map(x => x.id);
  else {
    const c = Stats.cols();
    const test = source === 'morning' ? i => c.HOUR[i] >= 6 && c.HOUR[i] < 11 : i => c.HOUR[i] >= 22 || c.HOUR[i] < 4;
    ids = Stats.top(i0, i1, 'track', 'plays', { key: source, test }).map(x => x.id);
  }
  return [...new Set(ids)].slice(0, n);
}

function generatorCard() {
  const P = App.range();
  const src = h('select', GEN_SOURCES.map(([v, l]) => h('option', { value: v }, l)));
  const count = h('select', [25, 50, 100, 200].map(n => h('option', { value: n, selected: n === 50 }, String(n))));
  const name = h('input', { type: 'text' });
  const target = h('select', h('option', { value: '' }, 'нова плејлиста'));
  const coverChk = h('input', { type: 'checkbox', checked: true });
  const setName = () => {
    const label = GEN_SOURCES.find(x => x[0] === src.value)[1].replace(' периода', '');
    name.value = label + ' · ' + resolvePeriod(App.period).short;
  };
  src.addEventListener('change', setName);
  setName();
  if (SpCache.playlists) {
    for (const p of SpCache.playlists.filter(p => p.mine)) target.appendChild(h('option', { value: p.id }, 'замени: ' + p.name));
  }
  const status = h('p.muted');
  return card('Направи плејлисту из статистике',
    cardNote('Песме по избору за период „' + P.label + '“. Песме без Spotify линка (из Last.fm-а) траже се претрагом.'),
    h('div.field', h('label', 'Шта'), src),
    h('div.field', h('label', 'Колико песама'), count),
    h('div.field', h('label', 'Назив'), name),
    h('div.field', h('label', 'Куда'), target, SpCache.playlists ? null : h('span.muted', ' (учитај плејлисте да би могао да замениш постојећу)')),
    h('label.check', coverChk, ' Направи омот плејлисте'),
    busyBtn('Направи', async () => {
      const ids = generatorTracks(src.value, +count.value);
      if (!ids.length) { toast('Нема песама за тај избор у овом периоду', true); return; }
      const uris = [];
      for (let k = 0; k < ids.length; k++) {
        status.textContent = 'Тражим песме на Spotify-у: ' + (k + 1) + ' / ' + ids.length;
        try { const u = await SP.resolveTrack(ids[k]); if (u) uris.push(u); } catch (e) { if (e.reason === 'offline') throw e; }
      }
      status.textContent = 'Правим плејлисту…';
      let id = target.value, url;
      if (!id) {
        const pl = await SP.api('/me/playlists', { method: 'POST', body: { name: name.value || 'Слушаоница', description: 'Направљено у Слушаоници (' + P.label + ')', public: false } });
        id = pl.id; url = pl.external_urls && pl.external_urls.spotify;
        SpCache.playlists = null;
      }
      await replacePlaylist(id, uris);
      if (coverChk.checked) {
        try {
          const jpg = await playlistCoverJpeg(name.value || 'Слушаоница', P.label);
          await SP.api('/playlists/' + id + '/images', { method: 'PUT', raw: jpg, contentType: 'image/jpeg' });
        } catch (e) { console.warn('cover', e); }
      }
      status.textContent = 'Готово: ' + countOf(uris.length, 'песма', 'песме', 'песама') + '.';
      toast('Плејлиста је спремна');
      if (url) openExternal(url);
    }), status);
}

/** A generated 640×640 JPEG cover (base64, no data: prefix) for playlists made here. */
async function playlistCoverJpeg(title, sub) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 640;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 640, 640);
  grad.addColorStop(0, '#1c5cab');
  grad.addColorStop(1, '#199e70');
  g.fillStyle = grad;
  g.fillRect(0, 0, 640, 640);
  g.fillStyle = 'rgba(255,255,255,.12)';
  for (let k = 0; k < 7; k++) g.fillRect(60 + k * 76, 520 - (k * 53 % 190) - 60, 44, (k * 53 % 190) + 60);
  g.fillStyle = '#fff';
  g.font = '700 58px system-ui, sans-serif';
  const words = title.split(' ');
  let line = '', y = 130;
  for (const w of words) {
    if (g.measureText(line + w).width > 540 && line) { g.fillText(line.trim(), 50, y); y += 68; line = ''; }
    line += w + ' ';
  }
  g.fillText(line.trim(), 50, y);
  g.font = '500 30px system-ui, sans-serif';
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.fillText(sub, 50, y + 54);
  g.fillText('Слушаоница', 50, 600);
  let q = 0.9, data;
  do { data = cv.toDataURL('image/jpeg', q).split(',')[1]; q -= 0.15; } while (data.length > 250000 && q > 0.3);
  return data;
}

  for (const p of Store.plays) {
    const y = new Date(p.t).getFullYear();

    h('thead', h('tr', h('th', 'Год.'), h('th', 'Укупно'), h('th', 'Извоз'), h('th', 'Spotify'), h('th', 'Last.fm'))),
    h('tbody', [...years].sort((a, b) => b[0] - a[0]).map(([y, v]) => h('tr', h('td', String(y)), v.map(x => h('td', x ? fmtInt(x) : '–'))))))));

/* ---------- demo.js: made-up listening history in Spotify's export format ----------
Used by "Учитај пробне податке" and by the test tools (tools/make-sample.mjs).
Deterministic (seeded), about six years, fictional artists.
*/

function demoHistory(opts = {}) {
  let seed = opts.seed || 42;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const syl = ['ka', 'lo', 'mi', 're', 'na', 'to', 'vi', 'sa', 'de', 'ru', 'zo', 'le', 'ba', 'ni', 'po', 'ma', 'ti', 'ko'];
  const word = n => { let w = ''; for (let i = 0; i < n; i++) w += pick(syl); return w[0].toUpperCase() + w.slice(1); };
  const titles = ['Ноћ', 'Кише', 'Summer', 'Лето', 'Neon', 'Река', 'Midnight', 'Звезде', 'Paper', 'Ветар', 'Gold', 'Сан', 'Echo', 'Пут', 'Fire', 'Море', 'Blue', 'Јутро', 'Stay', 'Сенке'];
  const title = () => pick(titles) + (rnd() < 0.5 ? ' ' + pick(titles).toLowerCase() : '') + (rnd() < 0.08 ? ' - Remastered 2011' : '');
  const artists = [];
  const nArt = 70;
  for (let a = 0; a < nArt; a++) {
    const name = rnd() < 0.35 ? word(2) + ' ' + word(2) : (rnd() < 0.5 ? 'The ' : '') + word(3);
    const albums = [];
    const nAl = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < nAl; k++) {
      const tracks = [];
      const nTr = 3 + Math.floor(rnd() * 8);
      for (let t = 0; t < nTr; t++) tracks.push({ name: title(), dur: 150000 + Math.floor(rnd() * 150000), uri: 'spotify:track:demo' + a + 'x' + k + 'x' + t });
      albums.push({ name: word(2) + ' ' + pick(titles), tracks });
    }
    // Each artist has a "life": when you discover them and how long they stay popular.
    artists.push({ name, albums, weight: Math.pow(rnd(), 2.2), start: rnd() * 0.85, span: 0.1 + rnd() * 0.9 });
  }
  const platforms = ['Android OS 13 API 33 (samsung, SM-S911B)', 'windows 10 (10.0.19045; x64)', 'web_player windows 10;chrome 120', 'Partner google cast_tv;Chromecast'];
  const countries = ['RS', 'RS', 'RS', 'RS', 'RS', 'RS', 'RS', 'RS', 'HR', 'GR', 'DE', 'IT'];
  const endReasons = ['trackdone', 'trackdone', 'trackdone', 'trackdone', 'fwdbtn', 'fwdbtn', 'endplay', 'backbtn'];
  const days = opts.days || 6 * 365;
  const now = Date.now();
  const start = now - days * DAY;
  const out = [];
  let country = 'RS', trip = 0;
  for (let d = 0; d < days; d++) {
    const dayT = start + d * DAY;
    const phase = d / days;
    const wd = new Date(dayT).getDay();
    if (trip > 0) trip--; else if (rnd() < 0.006) { trip = 3 + Math.floor(rnd() * 10); country = pick(countries.slice(8)); } else country = 'RS';
    if (rnd() < 0.08) continue; // a quiet day
    const active = artists.filter(a => phase >= a.start && phase <= a.start + a.span);
    if (!active.length) continue;
    const sessions = 1 + Math.floor(rnd() * (wd === 0 || wd === 6 ? 4 : 3));
    for (let s0 = 0; s0 < sessions; s0++) {
      const hour = pick([7, 8, 8, 9, 12, 13, 17, 18, 19, 20, 21, 21, 22, 23, 0]);
      let t = dayT - (dayT % DAY) + hour * 3600000 + Math.floor(rnd() * 3600000) - 3600000;
      const plat = rnd() < 0.7 ? platforms[0] : pick(platforms);
      const shuffle = rnd() < 0.45;
      const len = 3 + Math.floor(rnd() * 22);
      // Obsession: sometimes one song dominates a stretch of days.
      let focus = null;
      if (rnd() < 0.15) { const a = pick(active); focus = pick(pick(a.albums).tracks); }
      for (let k = 0; k < len; k++) {
        let r = rnd() * active.reduce((x, a) => x + a.weight, 0);
        let art = active[0];
        for (const a of active) { r -= a.weight; if (r <= 0) { art = a; break; } }
        const al = pick(art.albums);
        const tr = focus && rnd() < 0.5 ? focus : pick(al.tracks);
        const trArtist = focus && tr === focus ? artists.find(a => a.albums.some(x => x.tracks.includes(tr))) : art;
        const trAlbum = trArtist.albums.find(x => x.tracks.includes(tr));
        const reason = pick(endReasons);
        const ms = reason === 'trackdone' ? tr.dur : Math.floor(rnd() * tr.dur * 0.6);
        t += ms + 2000;
        out.push({
          ts: new Date(t).toISOString().replace(/\.\d+Z$/, 'Z'), platform: plat, ms_played: ms, conn_country: country,
          master_metadata_track_name: tr.name, master_metadata_album_artist_name: trArtist.name,
          master_metadata_album_album_name: trAlbum.name, spotify_track_uri: tr.uri,
          reason_start: k === 0 ? 'clickrow' : (rnd() < 0.8 ? 'trackdone' : 'fwdbtn'), reason_end: reason,
          shuffle, skipped: reason === 'fwdbtn' && ms < 30000, offline: rnd() < 0.05, incognito_mode: rnd() < 0.01,
        });
        if (t > now) break;
      }
    }
  }
  return out.filter(x => Date.parse(x.ts) < now);
}

async function loadDemo() {
  await Store.wipe();
  const arr = demoHistory();
  const { items } = parseHistoryFile(arr, 'demo');
  items.sort((a, b) => a.t - b.t);
  await Store.mergePlays(SRC_JSON, items);
  // Demo URIs are not real; covers stay initials.
  for (const t of Store.tracks) { delete t.uri; }
  Store.meta.demo = true;
  await Store.save(null);
}

/* ---------- app.js: navigation, overlays, start-up ---------- */

const TABS = [
  ['overview', 'Преглед', '<path d="M4 13h4v7H4zM10 4h4v16h-4zM16 9h4v11h-4z"/>'],
  ['time', 'Време', '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'],
  ['top', 'Топ', '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>'],
  ['analysis', 'Анализа', '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'],
  ['spotify', 'Spotify', '<circle cx="12" cy="12" r="8.5"/><path d="M8 10c2.6-.8 5.4-.6 8 .8M8.6 13.2c2-.6 4.2-.4 6.2.7M9.2 16c1.5-.4 3-.3 4.4.4"/>'],
];
function icon(paths) {
  return h('span.ico', { html: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>' });
}

const App = {
  tab: lsGet('tab', 'overview'),
  period: lsGet('period', { kind: 'all' }),
  state: lsGet('viewState', {}),
  overlays: [],
  backStack: [],

  range() { return resolvePeriod(this.period); },
  sub(view, defaults) {
    this.state[view] = Object.assign({}, defaults, this.state[view] || {});
    return this.state[view];
  },
  setSub(view, patch) {
    Object.assign(this.state[view] || (this.state[view] = {}), patch);
    lsSet('viewState', this.state);
    this.renderKeepScroll();
  },
  setPeriod(p) {
    this.period = p;
    lsSet('period', p);
    this.render();
    this.refreshOverlays();
  },
  go(tab, patch) {
    if (patch) Object.assign(this.state[tab] || (this.state[tab] = {}), patch);
    this.tab = tab;
    lsSet('tab', tab);
    this.closeAllOverlays();
    this.render();
    window.scrollTo(0, 0);
  },

  render() {
    const view = $('#view');
    clear(view);
    Tip.hide();
    const pb = $('#period-bar');
    clear(pb);
    const showPeriod = !Store.isEmpty() && this.tab !== 'spotify';
    if (showPeriod) pb.appendChild(periodBar());
    pb.style.display = showPeriod ? '' : 'none';
    try {
      view.appendChild(Views[this.tab]());
    } catch (e) {
      console.error(e);
      view.appendChild(h('div.view', h('p.warn', 'Грешка у приказу: ' + e.message)));
    }
    $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === this.tab));
  },
  renderKeepScroll() {
    const y = window.scrollY;
    this.render();
    window.scrollTo(0, y);
  },
  dataChanged() {
    Stats.cache.clear();
    this.render();
    this.refreshOverlays();
  },

  /* ---------- overlays (detail pages, settings) ---------- */

  openOverlay(title, build) {
    const body = h('div.ov-body');
    const el = h('div.overlay',
      h('header.ov-head', btn('←', () => this.back(), 'icon ghost'), h('b.ov-title', title)),
      body);
    const ov = { el, body, build, title };
    const fill = () => {
      clear(body);
      try { body.appendChild(build()); } catch (e) { console.error(e); body.appendChild(h('p.warn', e.message)); }
    };
    ov.fill = fill;
    fill();
    $('#overlay-root').appendChild(el);
    this.overlays.push(ov);
    document.body.classList.add('has-overlay');
    this.pushBack(() => this.closeTop());
    requestAnimationFrame(() => el.classList.add('in'));
  },
  closeTop() {
    const ov = this.overlays.pop();
    if (!ov) return;
    Tip.hide();
    ov.el.classList.remove('in');
    setTimeout(() => ov.el.remove(), 200);
    if (!this.overlays.length) document.body.classList.remove('has-overlay');
  },
  closeAllOverlays() {
    while (this.overlays.length) { this.closeTop(); this.backStack.pop(); }
    this.disarm();
  },
  refreshOverlays() { for (const ov of this.overlays) ov.fill(); },

  /**
   * Back button (Android back, browser back): closes the newest sheet or overlay.
   * The web version keeps one extra history entry while anything is open.
   */
  pushBack(fn) {
    this.backStack.push(fn);
    // While a history.back() is still in flight, the popstate handler re-arms instead.
    if (!IS_APP && !this.armed && !this.ignorePop) { history.pushState({ overlay: 1 }, ''); this.armed = true; }
  },
  popBack(fn) {
    const i = this.backStack.lastIndexOf(fn);
    if (i >= 0) this.backStack.splice(i, 1);
    this.disarm();
  },
  disarm() {
    if (!IS_APP && this.armed && !this.backStack.length) { this.armed = false; this.ignorePop = true; history.back(); }
  },
  /** Returns true if something was closed. */
  back() {
    const fn = this.backStack.pop();
    if (!fn) return false;
    fn();
    this.disarm();
    return true;
  },

  openDetail(kind, id) {
    const title = { track: 'Песма', artist: 'Извођач', album: 'Албум' }[kind];
    this.openOverlay(title, () => kind === 'track' ? trackDetail(id) : kind === 'artist' ? artistDetail(id) : albumDetail(id));
  },
  openDay(day) { this.openOverlay(WEEKDAYS[weekdayOfDay(day)] + ', ' + fmtDay(day), () => dayDetail(day)); },
  openWrapped() { this.openOverlay('Мој преглед', () => wrappedView()); },
  openTagger() { this.openOverlay('Групе извођача', () => taggerView()); },
  openSettings(focus) {
    if (this.overlays.length && this.overlays[this.overlays.length - 1].title === 'Подешавања') {
      const ov = this.overlays[this.overlays.length - 1];
      ov.build = () => settingsView(focus);
      ov.fill();
      return;
    }
    this.openOverlay('Подешавања', () => settingsView(focus));
  },

  /* ---------- start ---------- */

  async init() {
    applyTheme();
    const root = $('#app-root');
    $('#settings-btn').addEventListener('click', () => this.openSettings());
    $('#sync-btn').addEventListener('click', () => Sync.run({ force: true, report: true }));
    const nav = $('.tabs');
    for (const [id, label, paths] of TABS) {
      nav.appendChild(h('button', { type: 'button', 'data-tab': id, onclick: () => this.go(id) }, icon(paths), h('span', label)));
    }
    Sync.onChange(() => {
      $('#sync-btn').classList.toggle('spin', Sync.busy);
      $('#sync-status').textContent = Sync.busy ? Sync.status : '';
    });
    window.addEventListener('popstate', () => {
      if (this.ignorePop) {
        this.ignorePop = false;
        if (this.backStack.length && !this.armed) { history.pushState({ overlay: 1 }, ''); this.armed = true; }
        return;
      }
      this.armed = false;
      const fn = this.backStack.pop();
      if (fn) fn();
      if (this.backStack.length) { history.pushState({ overlay: 1 }, ''); this.armed = true; }
    });
    window.onNativeBack = () => this.back();
    window.onNativeAuth = () => this.checkAuth();
    window.onNativeResume = () => { if (Date.now() - (Sync.lastRun || 0) > 60000) Sync.run(); };
    window.addEventListener('resize', debounce(() => { if (!this.overlays.length) this.renderKeepScroll(); else this.refreshOverlays(); }, 250));

    try {
      await Store.load();
    } catch (e) {
      console.error(e);
      toast('База не може да се отвори: ' + e.message, true);
    }
    root.classList.add('ready');
    this.render();
    if (IS_APP && AppAndroid.ready) AppAndroid.ready();
    await this.checkAuth();
    setTimeout(() => Sync.run(), 800);
    setInterval(() => { if (!document.hidden && SP.loggedIn()) Sync.run(); }, 5 * 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Date.now() - (Sync.lastRun || 0) > 5 * 60000) Sync.run();
    });
  },

  /** Finishes a Spotify login that came back to the page (web) or the app (Android). */
  async checkAuth() {
    let query = '';
    if (IS_APP) {
      const url = AppAndroid.takeAuthRedirect();
      if (url) query = url.slice(url.indexOf('?'));
    } else if (/[?&](code|error)=/.test(location.search) && /[?&]state=/.test(location.search)) {
      query = location.search;
      history.replaceState(null, '', location.pathname);
    }
    if (!query) return;
    try {
      await SP.finishLogin(query);
      toast('Spotify је повезан');
      // Spotify keeps only the last 50 plays, so background logging starts on by default.
      if (IS_APP) { Settings.set('bgSync', true); AppAndroid.setBackgroundSync(true); }
      if (Store.meta.demo) await Store.wipe();
      this.render();
      await Sync.run({ force: true });
    } catch (e) {
      toast(e.message, true);
    }
  },
};

App.init();
