/* ---------- importers.js: Spotify data export (ZIP / JSON) ---------- */

/** Minimal ZIP reader: lists entries and inflates them with the browser's DecompressionStream. */
async function readZip(buf) {
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ZIP фајл није исправан');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const entries = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true), extraLen = dv.getUint16(off + 30, true), cmtLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const name = dec.decode(new Uint8Array(buf, off + 46, nameLen));
    entries.push({ name, method, csize, local });
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return entries.map(e => ({
    name: e.name,
    async text() {
      const lnl = dv.getUint16(e.local + 26, true), lel = dv.getUint16(e.local + 28, true);
      const data = new Uint8Array(buf, e.local + 30 + lnl + lel, e.csize);
      if (e.method === 0) return dec.decode(data);
      if (e.method !== 8) throw new Error('Непознато сажимање у ZIP-у');
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return await new Response(stream).text();
    },
  }));
}

const HISTORY_FILE = /(Streaming_?History[^/]*|endsong[^/]*)\.json$/i;

function platformGroup(raw) {
  const s = (raw || '').toLowerCase();
  if (!s) return '';
  if (s.includes('android')) return s.includes('tv') ? 'ТВ / звучник' : 'Android';
  if (s.includes('ios') || s.includes('iphone') || s.includes('ipad')) return 'iPhone / iPad';
  if (s.includes('web_player') || s.includes('web player')) return 'Веб';
  if (s.includes('windows')) return 'Windows';
  if (s.includes('os x') || s.includes('osx') || s.includes('mac')) return 'Mac';
  if (s.includes('linux')) return 'Linux';
  if (/(tv|cast|sonos|speaker|echo|alexa|google_home|partner|playstation|xbox|car|auto)/.test(s)) return 'ТВ / звучник';
  return 'Друго';
}

/** Turns one parsed JSON history file into play items for Store.mergePlays(SRC_JSON, …). */
function parseHistoryFile(arr, file) {
  const out = [];
  let podcasts = 0;
  if (!Array.isArray(arr)) return { items: out, podcasts, extended: false };
  const extended = arr.length > 0 && 'ts' in arr[0];
  for (const r of arr) {
    if (extended) {
      const name = r.master_metadata_track_name;
      if (!name) { podcasts++; continue; } // podcast episodes, audiobooks, video
      const end = Date.parse(r.ts);
      const ms = r.ms_played | 0;
      if (!isFinite(end)) continue;
      out.push({
        file, t: end - ms, ms, name,
        artist: r.master_metadata_album_artist_name || '?',
        album: r.master_metadata_album_album_name || '',
        uri: r.spotify_track_uri || '',
        platform: platformGroup(r.platform),
        country: r.conn_country && r.conn_country !== 'ZZ' ? r.conn_country : '',
        reasonStart: r.reason_start || '', reasonEnd: r.reason_end || '',
        flags: (r.shuffle ? F_SHUFFLE : 0) | (r.skipped ? F_SKIPPED : 0) | (r.offline ? F_OFFLINE : 0) | (r.incognito_mode ? F_INCOGNITO : 0),
      });
    } else if (r.endTime && r.trackName) {
      // Short "Account data" history: end time in UTC, minute precision.
      const end = Date.parse(r.endTime.replace(' ', 'T') + ':00Z');
      const ms = r.msPlayed | 0;
      if (!isFinite(end)) continue;
      if (r.artistName === 'Unknown Artist' && r.trackName === 'Unknown Track') continue;
      out.push({ file, t: end - ms, ms, name: r.trackName, artist: r.artistName || '?', album: '' });
    } else if (r.episodeName || r.podcastName) {
      podcasts++;
    }
  }
  return { items: out, podcasts, extended };
}

/**
 * Imports the files the user picked (the export ZIP or its JSON files).
 * progress(text) is called along the way. Returns a summary.
 */
async function importSpotifyFiles(files, progress) {
  const sources = [];
  for (const f of files) {
    if (/\.zip$/i.test(f.name) || f.type === 'application/zip') {
      progress('Отварам ' + f.name + '…');
      const entries = await readZip(await f.arrayBuffer());
      for (const e of entries) {
        if (HISTORY_FILE.test(e.name) && !/video/i.test(e.name)) sources.push({ name: e.name.split('/').pop(), text: () => e.text() });
      }
    } else {
      sources.push({ name: f.name, text: () => f.text() });
    }
  }
  if (!sources.length) throw new Error('У изабраним фајловима нема историје слушања (Streaming_History…json).');

  let items = [], podcasts = 0, extended = false, files_ = 0;
  for (const src of sources) {
    progress('Читам ' + src.name + '…');
    await nextFrame();
    let data;
    try { data = JSON.parse(await src.text()); } catch (e) { continue; }
    const r = parseHistoryFile(data, src.name);
    if (!r.items.length && !r.podcasts) continue;
    files_++;
    podcasts += r.podcasts;
    extended = extended || r.extended;
    items = items.concat(r.items);
  }
  if (!items.length) throw new Error('Фајлови не личе на Spotify историју слушања.');
  progress('Спајам ' + fmtInt(items.length) + ' слушања…');
  await nextFrame();
  items.sort((a, b) => a.t - b.t);
  const res = await Store.mergePlays(SRC_JSON, items);
  Store.meta.imports = (Store.meta.imports || []).concat([{
    at: Date.now(), files: files_, plays: items.length, added: res.added, extended,
    from: items[0].t, to: items[items.length - 1].t,
  }]);
  await Store.saveMeta();
  return Object.assign(res, { files: files_, podcasts, extended, total: items.length });
}

/* ---------- backup ---------- */

async function gzip(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function gunzip(buf) {
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
async function saveBytes(name, mime, bytes) {
  if (window.AppAndroid && AppAndroid.saveFile) {
    AppAndroid.saveFile(name, mime, bytesToBase64(bytes));
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = h('a', { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function exportBackup() {
  const bytes = await gzip(JSON.stringify(Store.snapshot()));
  await saveBytes('slusaonica-' + isoDate(Date.now()) + '.json.gz', 'application/gzip', bytes);
}
async function importBackup(file) {
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf, 0, 2);
  const text = head[0] === 0x1f && head[1] === 0x8b ? await gunzip(buf) : new TextDecoder().decode(buf);
  await Store.restore(JSON.parse(text));
}
/** CSV of every play, for spreadsheets. */
async function exportCsv() {
  const esc = v => {
    v = v == null ? '' : String(v);
    return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  const rows = ['datum,vreme,pesma,izvodjac,album,sekundi,izvor,spotify_uri'];
  for (const p of Store.plays) {
    const t = Store.tracks[p.tr], d = new Date(p.t);
    const src = [p.f & SRC_JSON ? 'json' : '', p.f & SRC_API ? 'spotify' : '', p.f & SRC_LFM ? 'lastfm' : ''].filter(Boolean).join('+');
    rows.push([isoDate(p.t), String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'),
      esc(t.n), esc(Store.artists[t.a].n), esc(t.al >= 0 ? Store.albums[t.al].n : ''),
      p.ms >= 0 ? Math.round(p.ms / 1000) : '', src, t.uri || ''].join(','));
  }
  await saveBytes('slusaonica-' + isoDate(Date.now()) + '.csv', 'text/csv', new TextEncoder().encode('﻿' + rows.join('\n')));
}

/* ---------- spotify.js: login (Authorization Code + PKCE) and Web API client ----------

Development-mode limits (since February 2026) this client respects:
  - search returns at most 10 results per request,
  - no batch track/artist/album lookups (one item per request, done lazily for covers),
  - library writes go through /me/library?uris=…, playlist tracks through /playlists/{id}/items,
  - only your own playlists can be read item by item.
*/

const IS_APP = !!window.AppAndroid;
const PAGES_URL = 'https://kosmet-crypto.github.io/Spotify-Stats/';
const SP_SCOPES = [
  'user-read-recently-played', 'user-top-read', 'user-read-playback-state', 'user-modify-playback-state',
  'user-read-currently-playing', 'user-library-read', 'user-library-modify', 'user-follow-read',
  'playlist-read-private', 'playlist-read-collaborative', 'playlist-modify-private', 'playlist-modify-public',
  'ugc-image-upload',
];

class ApiError extends Error {
  constructor(status, message, reason) { super(message); this.status = status; this.reason = reason; }
}

const SP = {
  defaultRedirect() {
    // The web version on GitHub Pages handles its own callback; the Android app uses the same page,
    // which forwards the login back into the app (slusaonica://callback).
    if (!IS_APP && location.hostname.endsWith('github.io')) return new URL('callback.html', location.href).href;
    return PAGES_URL + 'callback.html';
  },
  redirectUri() { return Settings.get('redirectUri') || this.defaultRedirect(); },
  configured() { return !!Settings.get('clientId'); },

  webTokens() { return lsGet('sp_tokens', null); },
  loggedIn() {
    if (IS_APP) { try { return AppAndroid.loggedIn(); } catch (e) { return false; } }
    const t = this.webTokens();
    return !!(t && t.refresh);
  },

  async login() {
    const clientId = Settings.get('clientId');
    if (!clientId) throw new Error('Прво упиши Client ID');
    const verifier = randomString(64);
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const state = (IS_APP ? 'a' : 'w') + randomString(16);
    lsSet('sp_pkce', { verifier, state, redirect: this.redirectUri(), clientId });
    const url = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
      response_type: 'code', client_id: clientId, scope: SP_SCOPES.join(' '),
      redirect_uri: this.redirectUri(), state, code_challenge_method: 'S256', code_challenge: challenge,
    });
    if (IS_APP) AppAndroid.openExternal(url);
    else location.href = url;
  },

  /** Finishes the login from the redirect URL's query (?code=…&state=… or ?error=…). */
  async finishLogin(query) {
    const q = new URLSearchParams(query);
    const pk = lsGet('sp_pkce', null);
    if (q.get('error')) throw new Error(q.get('error') === 'access_denied' ? 'Пријава је отказана' : 'Spotify: ' + q.get('error'));
    if (!pk || q.get('state') !== pk.state) throw new Error('Пријава је истекла, покушај поново');
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', code: q.get('code'), redirect_uri: pk.redirect,
        client_id: pk.clientId, code_verifier: pk.verifier,
      }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('Spotify пријава није успела: ' + (j.error_description || j.error || res.status));
    localStorage.removeItem('sp_pkce');
    const tokens = { clientId: pk.clientId, access: j.access_token, refresh: j.refresh_token, expiresIn: j.expires_in };
    if (IS_APP) AppAndroid.setTokens(JSON.stringify(tokens));
    else lsSet('sp_tokens', { clientId: pk.clientId, access: j.access_token, refresh: j.refresh_token, exp: Date.now() + j.expires_in * 1000 });
    this.me = null;
  },

  logout() {
    if (IS_APP) AppAndroid.clearTokens();
    localStorage.removeItem('sp_tokens');
    Settings.set('bgSync', false);
    this.me = null;
  },

  async token() {
    if (IS_APP) {
      // Blocks briefly while the app refreshes; the app keeps one refresh at a time for the background job too.
      const r = JSON.parse(AppAndroid.accessToken());
      if (r.token) return r.token;
      throw new ApiError(0, r.error === 'logged_out' ? 'Ниси пријављен на Spotify' : 'Нема интернета', r.error);
    }
    const t = this.webTokens();
    if (!t || !t.refresh) throw new ApiError(0, 'Ниси пријављен на Spotify', 'logged_out');
    if (t.access && t.exp - 60000 > Date.now()) return t.access;
    if (!this.refreshing) {
      this.refreshing = (async () => {
        let res;
        try {
          res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: t.refresh, client_id: t.clientId }),
          });
        } catch (e) {
          throw new ApiError(0, 'Нема интернета', 'offline');
        }
        const j = await res.json().catch(() => ({}));
        if (res.status === 400 || res.status === 401) {
          localStorage.removeItem('sp_tokens');
          throw new ApiError(401, 'Spotify пријава је истекла, пријави се поново', 'logged_out');
        }
        if (!res.ok) throw new ApiError(res.status, 'Spotify не одговара', 'offline');
        lsSet('sp_tokens', { clientId: t.clientId, access: j.access_token, refresh: j.refresh_token || t.refresh, exp: Date.now() + j.expires_in * 1000 });
        return j.access_token;
      })().finally(() => { this.refreshing = null; });
    }
    return this.refreshing;
  },

  /** Calls the Web API. path is relative to /v1 (may include a query). */
  async api(path, opts = {}) {
    const token = await this.token();
    const url = path.startsWith('http') ? path : 'https://api.spotify.com/v1' + path;
    const init = { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token } };
    if (opts.raw) {
      init.body = opts.raw;
      init.headers['Content-Type'] = opts.contentType;
    } else if (opts.body !== undefined) {
      init.body = JSON.stringify(opts.body);
      init.headers['Content-Type'] = 'application/json';
    }
    let res;
    try { res = await fetch(url, init); } catch (e) { throw new ApiError(0, 'Нема интернета', 'offline'); }
    if (res.status === 429 && !opts.retried) {
      const wait = Math.min(30, parseInt(res.headers.get('Retry-After') || '3', 10));
      await sleep(wait * 1000);
      return this.api(path, Object.assign({}, opts, { retried: true }));
    }
    if (res.status === 401 && !IS_APP && !opts.retried) {
      const t = this.webTokens();
      if (t) { t.exp = 0; lsSet('sp_tokens', t); }
      return this.api(path, Object.assign({}, opts, { retried: true }));
    }
    if (res.status === 204 || res.status === 202) return null;
    const text = await res.text();
    let j = null;
    try { j = text ? JSON.parse(text) : null; } catch (e) { /* not JSON (e.g. snapshot id text) */ }
    if (!res.ok) {
      const msg = j && j.error ? (j.error.message || j.error) : 'HTTP ' + res.status;
      throw new ApiError(res.status, 'Spotify: ' + msg, j && j.error && j.error.reason);
    }
    return j;
  },

  /** Follows `next` links and collects `items` (limit caps the total). */
  async all(path, limit = 5000, onPage) {
    let url = path, out = [];
    while (url && out.length < limit) {
      const j = await this.api(url);
      const page = j.items ? j : (j.artists || j);
      out = out.concat(page.items || []);
      if (onPage) onPage(out.length, page.total);
      url = page.next;
    }
    return out;
  },

  async profile() {
    if (!this.me) this.me = await this.api('/me');
    return this.me;
  },

  /* ---------- player ---------- */

  async playTrack(uri) {
    try {
      await this.api('/me/player/play', { method: 'PUT', body: { uris: [uri] } });
      return true;
    } catch (e) {
      // No active device: open the song in the Spotify app instead.
      if (e.status === 404 || e.reason === 'NO_ACTIVE_DEVICE') { openExternal(spotifyOpenUrl(uri)); return false; }
      throw e;
    }
  },

  /* ---------- library (Feb 2026 generic endpoints) ---------- */

  async isSaved(uris) {
    const r = await this.api('/me/library/contains?uris=' + encodeURIComponent(uris.join(',')));
    return Array.isArray(r) ? r : [];
  },
  async save(uris, on) {
    await this.api('/me/library?uris=' + encodeURIComponent(uris.join(',')), { method: on ? 'PUT' : 'DELETE' });
  },

  /* ---------- lookups for covers and missing links ---------- */

  async searchTracks(q, limit = 10) {
    const j = await this.api('/search?' + new URLSearchParams({ q, type: 'track', limit: String(Math.min(10, limit)) }));
    return (j && j.tracks && j.tracks.items) || [];
  },
  async search(q) {
    return await this.api('/search?' + new URLSearchParams({ q, type: 'track,artist', limit: '10' }));
  },
  /** Finds the Spotify URI for a local track (Last.fm-only tracks have none). */
  async resolveTrack(id) {
    const t = Store.tracks[id];
    if (t.uri) return t.uri;
    const artist = Store.artists[t.a].n;
    const items = await this.searchTracks('track:' + t.n + ' artist:' + artist, 5);
    const want = trackKey(artist, t.n);
    const hit = items.find(x => trackKey(x.artists[0].name, x.name) === want) || items[0];
    if (!hit) return null;
    t.uri = hit.uri;
    if (!t.dur) t.dur = hit.duration_ms;
    setCoverFromAlbum(t, hit.album);
    Covers.dirty();
    return t.uri;
  },
};

function setCoverFromAlbum(t, album) {
  const imgs = album && album.images;
  if (!imgs || !imgs.length) return;
  const img = (imgs[1] || imgs[0]).url;
  if (!t.img) t.img = img;
  if (t.al >= 0 && !Store.albums[t.al].img) Store.albums[t.al].img = img;
}

function openExternal(url) {
  if (!url) return;
  if (IS_APP) AppAndroid.openExternal(url);
  else window.open(url, '_blank', 'noopener');
}

/**
 * Covers: fetched one track at a time (dev mode has no batch lookups), only for what is on screen,
 * and remembered in the database.
 */
const Covers = {
  queue: [], queued: new Set(), running: false, listeners: new Map(),
  want(trackId, cb) {
    const t = Store.tracks[trackId];
    if (!t || t.img) return;
    if (!t.uri || !SP.loggedIn() || t.noImg) return;
    if (cb) {
      if (!this.listeners.has(trackId)) this.listeners.set(trackId, []);
      this.listeners.get(trackId).push(cb);
    }
    if (this.queued.has(trackId)) return;
    this.queued.add(trackId);
    this.queue.push(trackId);
    this.run();
  },
  async run() {
    if (this.running) return;
    this.running = true;
    try {
      while (this.queue.length) {
        const id = this.queue.shift();
        const t = Store.tracks[id];
        try {
          const j = await SP.api('/tracks/' + spotifyIdFromUri(t.uri));
          setCoverFromAlbum(t, j.album);
          if (j.artists && j.artists[0]) Store.artists[t.a].sid = Store.artists[t.a].sid || j.artists[0].id;
          if (!t.img) t.noImg = true;
          this.dirty();
          (this.listeners.get(id) || []).forEach(cb => cb(t.img));
        } catch (e) {
          if (e.reason === 'logged_out' || e.reason === 'offline') { this.queue = []; break; }
          t.noImg = true;
        }
        this.listeners.delete(id);
        await sleep(120);
      }
    } finally {
      this.running = false;
      this.queued.clear();
    }
  },
  dirty: debounce(() => { Store.saveDict(); }, 4000),
};

/* ---------- sync.js: Last.fm scrobbles and Spotify "recently played" ---------- */

const LF_PLACEHOLDER = '2a96cbd8b46e442fc41c2b86b821562f';

const LF = {
  configured() { return !!(Settings.get('lastfmUser') && Settings.get('lastfmKey')); },
  async call(params) {
    const url = 'https://ws.audioscrobbler.com/2.0/?' + new URLSearchParams(Object.assign({
      api_key: Settings.get('lastfmKey'), format: 'json',
    }, params));
    for (let attempt = 0; attempt < 4; attempt++) {
      let res;
      try { res = await fetch(url); } catch (e) { throw new Error('Last.fm: нема интернета'); }
      const j = await res.json().catch(() => null);
      if (j && j.error) {
        if (j.error === 29 || j.error === 8 || j.error === 16) { await sleep(2000 * (attempt + 1)); continue; }
        if (j.error === 10 || j.error === 26) throw new Error('Last.fm: API кључ није исправан');
        if (j.error === 6) throw new Error('Last.fm: корисник не постоји');
        if (j.error === 17) throw new Error('Last.fm: слушања су скривена — у подешавањима Last.fm-а искључи „Hide recent listening“');
        throw new Error('Last.fm: ' + j.message);
      }
      if (!res.ok || !j) { await sleep(1500 * (attempt + 1)); continue; }
      return j;
    }
    throw new Error('Last.fm не одговара, покушај касније');
  },
  async userInfo() {
    const j = await this.call({ method: 'user.getinfo', user: Settings.get('lastfmUser') });
    return j.user;
  },
  toItems(tracks) {
    const out = [];
    for (const t of tracks) {
      if (!t.date || (t['@attr'] && t['@attr'].nowplaying)) continue;
      const img = (t.image || []).find(i => i.size === 'large');
      const src = img && img['#text'] && !img['#text'].includes(LF_PLACEHOLDER) ? img['#text'] : '';
      out.push({
        t: parseInt(t.date.uts, 10) * 1000, ms: -1, name: t.name,
        artist: (t.artist && (t.artist['#text'] || t.artist.name)) || '?',
        album: (t.album && t.album['#text']) || '', img: src,
      });
    }
    return out;
  },
  async page(params) {
    const j = await this.call(Object.assign({ method: 'user.getrecenttracks', user: Settings.get('lastfmUser'), limit: 200 }, params));
    const rt = j.recenttracks;
    const tr = rt.track ? (Array.isArray(rt.track) ? rt.track : [rt.track]) : [];
    return { items: this.toItems(tr), pages: parseInt(rt['@attr'].totalPages, 10) || 0, total: parseInt(rt['@attr'].total, 10) || 0 };
  },

  /**
   * New scrobbles since the last sync, then (step by step, resumable) older history until it is all in.
   * progress(text) reports; returns the number of plays added.
   */
  async sync(progress) {
    const st = Store.meta.lastfm || (Store.meta.lastfm = {});
    if (st.user && st.user !== Settings.get('lastfmUser')) {
      // Another account: start over.
      for (const k of Object.keys(st)) delete st[k];
    }
    st.user = Settings.get('lastfmUser');
    let added = 0;
    // 1. Newer than what we have.
    if (st.newest) {
      let page = 1, pages = 1, batch = [];
      while (page <= pages) {
        const r = await this.page({ from: Math.floor(st.newest / 1000) + 1, page });
        pages = r.pages;
        batch = batch.concat(r.items);
        progress && progress('Last.fm: нова слушања, страна ' + page + '/' + Math.max(1, pages));
        page++;
        await sleep(220);
      }
      if (batch.length) {
        added += (await Store.mergePlays(SRC_LFM, batch)).added;
        st.newest = batch.reduce((m, b) => Math.max(m, b.t), st.newest);
      }
    }
    // 2. Older history (the first time: everything), saved every few pages so it can resume.
    if (!st.done) {
      const to = st.oldest ? Math.floor(st.oldest / 1000) - 1 : Math.floor(Date.now() / 1000);
      let page = 1, pages = 1, batch = [];
      const flush = async () => {
        if (!batch.length) return;
        added += (await Store.mergePlays(SRC_LFM, batch)).added;
        st.oldest = batch.reduce((m, b) => Math.min(m, b.t), st.oldest || Infinity);
        st.newest = batch.reduce((m, b) => Math.max(m, b.t), st.newest || 0);
        batch = [];
        await Store.saveMeta();
      };
      while (page <= pages) {
        const r = await this.page({ to, page });
        pages = r.pages;
        batch = batch.concat(r.items);
        progress && progress('Last.fm: историја, страна ' + page + ' од ' + Math.max(1, pages) + ' (' + fmtInt(r.total) + ' укупно)');
        if (page % 10 === 0) await flush();
        page++;
        await sleep(220);
      }
      await flush();
      st.done = true;
    }
    st.last = Date.now();
    await Store.saveMeta();
    return added;
  },
};

function recentToItem(x) {
  const played = Date.parse(x.played_at);
  const dur = x.duration_ms || 0;
  return {
    t: played - (dur || 180000), ms: -1, name: x.name, artist: x.artist || '?',
    album: x.album || '', uri: x.uri, dur, img: x.img || '',
  };
}

const Sync = {
  busy: false,
  status: '',
  listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(fn => fn()); },
  setStatus(s) { this.status = s; this.emit(); },

  /** Plays the Android background job collected while the app was closed. */
  async drainNative() {
    if (!IS_APP || !AppAndroid.drainRecent) return 0;
    let batches = [];
    try { batches = JSON.parse(AppAndroid.drainRecent()); } catch (e) { return 0; }
    const items = [];
    for (const b of batches) for (const x of b) items.push(recentToItem(x));
    if (!items.length) return 0;
    return (await Store.mergePlays(SRC_API, items)).added;
  },

  async recent() {
    if (!SP.loggedIn()) return 0;
    const j = await SP.api('/me/player/recently-played?limit=50');
    const items = (j.items || []).filter(it => it.track).map(it => {
      const tr = it.track;
      const imgs = tr.album && tr.album.images;
      return recentToItem({
        played_at: it.played_at, uri: tr.uri, name: tr.name, duration_ms: tr.duration_ms,
        artist: tr.artists && tr.artists[0] ? tr.artists[0].name : '?',
        album: tr.album ? tr.album.name : '', img: imgs && imgs.length ? (imgs[1] || imgs[0]).url : '',
      });
    });
    const r = await Store.mergePlays(SRC_API, items);
    Store.meta.recent = { last: Date.now() };
    await Store.saveMeta();
    return r.added;
  },

  /** Everything that is set up; quiet=true for automatic runs. */
  async run(opts = {}) {
    if (this.busy) return;
    this.busy = true;
    let added = 0;
    const errors = [];
    try {
      if (Store.meta.demo) return;
      this.setStatus('Синхронизујем…');
      added += await this.drainNative();
      if (SP.loggedIn() && (opts.force || Settings.get('recentAuto'))) {
        try { added += await this.recent(); } catch (e) { errors.push(e.message); }
      }
      if (LF.configured() && (opts.force || Settings.get('lastfmAuto'))) {
        try { added += await LF.sync(t => this.setStatus(t)); } catch (e) { errors.push(e.message); }
      }
    } finally {
      this.busy = false;
      this.lastRun = Date.now();
      this.setStatus(errors.length ? errors[0] : '');
    }
    if (added) App.dataChanged();
    if (opts.report) {
      if (errors.length) toast(errors[0], true);
      else toast(added ? 'Додато ' + countOf(added, 'ново слушање', 'нова слушања', 'нових слушања') : 'Нема нових слушања');
    }
  },
};

/* ---------- stats.js: every number and series the screens show ----------

Stats.cols() turns the plays into typed columns once per data version; every function below
works on an index range [i0, i1) of those columns (the selected period).
A play "counts" when it lasted at least Settings.minPlaySec (or when its length is unknown:
Last.fm and Spotify's recently played only report real plays). Minutes include every play.
*/

const DEFAULT_TRACK_MS = 210000;

const Stats = {
  _cols: null, _ver: -1, _setKey: '',
  cache: new Map(),

  cols() {
    const setKey = Settings.get('minPlaySec') + '|' + Settings.get('sessionGapMin');
    if (this._cols && this._ver === Store.version && this._setKey === setKey) return this._cols;
    this.cache.clear();
    const P = Store.plays, n = P.length, tracks = Store.tracks;
    const minMs = Settings.get('minPlaySec') * 1000;

    // Estimated length per track for plays whose length is unknown: known duration, else the
    // average of complete JSON plays, else a typical song length.
    const nT = tracks.length;
    const sum = new Float64Array(nT), cnt = new Uint32Array(nT);
    const doneReason = Store.reasons.indexOf('trackdone');
    for (let i = 0; i < n; i++) {
      const p = P[i];
      if (p.ms > 30000 && (doneReason < 0 || p.re === doneReason)) { sum[p.tr] += p.ms; cnt[p.tr]++; }
    }
    const est = new Float64Array(nT);
    for (let t = 0; t < nT; t++) est[t] = tracks[t].dur || (cnt[t] ? sum[t] / cnt[t] : DEFAULT_TRACK_MS);

    const c = {
      n, T: new Float64Array(n), MS: new Float64Array(n), CNT: new Uint8Array(n), DAY: new Int32Array(n),
      HOUR: new Uint8Array(n), TR: new Int32Array(n), AR: new Int32Array(n), AL: new Int32Array(n),
      F: new Uint16Array(n), P: new Uint8Array(n), C: new Uint8Array(n), RS: new Uint8Array(n), RE: new Uint8Array(n),
      KNOWN: new Uint8Array(n), est,
    };
    let lastHourStart = -Infinity, lastOffset = 0;
    for (let i = 0; i < n; i++) {
      const p = P[i];
      c.T[i] = p.t;
      c.MS[i] = p.ms >= 0 ? p.ms : est[p.tr];
      c.KNOWN[i] = p.ms >= 0 ? 1 : 0;
      c.CNT[i] = p.ms < 0 || p.ms >= minMs ? 1 : 0;
      // Timezone offset only changes on DST switches; recompute it once per hour of data.
      if (p.t - lastHourStart >= 3600000 || p.t < lastHourStart) {
        lastHourStart = p.t - (p.t % 3600000);
        lastOffset = new Date(p.t).getTimezoneOffset() * 60000;
      }
      const local = p.t - lastOffset;
      c.DAY[i] = Math.floor(local / DAY);
      c.HOUR[i] = Math.floor((local % DAY + DAY) % DAY / 3600000);
      const tr = tracks[p.tr];
      c.TR[i] = p.tr; c.AR[i] = tr.a; c.AL[i] = tr.al;
      c.F[i] = p.f; c.P[i] = p.p; c.C[i] = p.c; c.RS[i] = p.rs; c.RE[i] = p.re;
    }
    this._cols = c; this._ver = Store.version; this._setKey = setKey;
    return c;
  },

  /** Memoizes per data version and arguments. */
  memo(key, fn) {
    this.cols();
    if (this.cache.has(key)) return this.cache.get(key);
    const v = fn();
    this.cache.set(key, v);
    return v;
  },

  range(period) {
    const c = this.cols();
    return [lowerBound(c.T, period.from), lowerBound(c.T, period.to)];
  },

  /* ---------- totals ---------- */

  totals(i0, i1) {
    return this.memo('tot' + i0 + ':' + i1, () => {
      const c = this.cols();
      let plays = 0, ms = 0, known = 0;
      const tr = new Set(), ar = new Set(), al = new Set(), days = new Set();
      for (let i = i0; i < i1; i++) {
        ms += c.MS[i];
        if (c.KNOWN[i]) known++;
        if (!c.CNT[i]) continue;
        plays++;
        tr.add(c.TR[i]); ar.add(c.AR[i]); if (c.AL[i] >= 0) al.add(c.AL[i]);
        days.add(c.DAY[i]);
      }
      const firstDay = i1 > i0 ? c.DAY[i0] : 0, lastDay = i1 > i0 ? c.DAY[i1 - 1] : 0;
      const spanDays = i1 > i0 ? lastDay - firstDay + 1 : 0;
      return {
        plays, ms, tracks: tr.size, artists: ar.size, albums: al.size, activeDays: days.size, spanDays,
        first: i1 > i0 ? c.T[i0] : 0, last: i1 > i0 ? c.T[i1 - 1] : 0, estimated: i1 - i0 - known, all: i1 - i0,
      };
    });
  },

  /* ---------- time series ---------- */

  /** Buckets: 'day' | 'week' | 'month' | 'year'. Returns {keys, labels, plays, ms}, zero-filled. */
  series(i0, i1, bucket, fromDay, toDay) {
    return this.memo('ser' + [i0, i1, bucket, fromDay, toDay], () => {
      const c = this.cols();
      if (fromDay == null) { fromDay = i1 > i0 ? c.DAY[i0] : dayNum(Date.now()); toDay = i1 > i0 ? c.DAY[i1 - 1] : fromDay; }
      const keyOf = d => {
        if (bucket === 'day') return d;
        if (bucket === 'week') return d - weekdayOfDay(d);
        const k = monthKeyOfDay(d);
        return bucket === 'month' ? k : Math.floor(k / 12);
      };
      const keys = [];
      if (bucket === 'day') for (let d = fromDay; d <= toDay; d++) keys.push(d);
      else if (bucket === 'week') for (let d = keyOf(fromDay); d <= toDay; d += 7) keys.push(d);
      else if (bucket === 'month') for (let k = keyOf(fromDay); k <= keyOf(toDay); k++) keys.push(k);
      else for (let y = keyOf(fromDay); y <= keyOf(toDay); y++) keys.push(y);
      const idx = new Map(keys.map((k, i) => [k, i]));
      const plays = new Float64Array(keys.length), ms = new Float64Array(keys.length);
      for (let i = i0; i < i1; i++) {
        const j = idx.get(keyOf(c.DAY[i]));
        if (j === undefined) continue;
        ms[j] += c.MS[i];
        plays[j] += c.CNT[i];
      }
      const labels = keys.map(k => bucket === 'day' ? fmtDay(k) : bucket === 'week' ? 'недеља од ' + fmtDay(k)
        : bucket === 'month' ? monthKeyLabel(k) : String(k));
      const short = keys.map(k => {
        if (bucket === 'year') return String(k);
        if (bucket === 'month') return (k % 12 === 0 ? String(Math.floor(k / 12)) : MONTHS_SHORT[k % 12]);
        const d = dayDate(k);
        return d.getUTCDate() + '. ' + MONTHS_SHORT[d.getUTCMonth()];
      });
      return { keys, labels, short, plays: Array.from(plays), ms: Array.from(ms) };
    });
  },

  /** 7×24 matrix (Monday first) of plays or ms. */
  hourWeek(i0, i1, metric) {
    return this.memo('hw' + [i0, i1, metric], () => {
      const c = this.cols();
      const m = Array.from({ length: 7 }, () => new Array(24).fill(0));
      for (let i = i0; i < i1; i++) m[weekdayOfDay(c.DAY[i])][c.HOUR[i]] += metric === 'ms' ? c.MS[i] : c.CNT[i];
      return m;
    });
  },
  /** Per-day totals as Map(day → {plays, ms}). */
  days(i0, i1) {
    return this.memo('days' + i0 + ':' + i1, () => {
      const c = this.cols(), m = new Map();
      for (let i = i0; i < i1; i++) {
        let v = m.get(c.DAY[i]);
        if (!v) m.set(c.DAY[i], v = { plays: 0, ms: 0 });
        v.plays += c.CNT[i]; v.ms += c.MS[i];
      }
      return m;
    });
  },

  /** Longest run of days with listening, and the run that ends today (or on the period's last day). */
  streaks(i0, i1) {
    return this.memo('str' + i0 + ':' + i1, () => {
      const days = [...this.days(i0, i1).keys()].sort((a, b) => a - b);
      let best = { len: 0, from: 0, to: 0 }, cur = null;
      for (const d of days) {
        if (cur && d === cur.to + 1) cur.to = d, cur.len++;
        else cur = { len: 1, from: d, to: d };
        if (cur.len > best.len) best = Object.assign({}, cur);
      }
      const today = dayNum(Date.now());
      const current = cur && cur.to >= today - 1 ? cur : null;
      // Longest break between listening days.
      let gap = { len: 0, from: 0, to: 0 };
      for (let i = 1; i < days.length; i++) {
        const g = days[i] - days[i - 1] - 1;
        if (g > gap.len) gap = { len: g, from: days[i - 1] + 1, to: days[i] - 1 };
      }
      return { best, current, gap };
    });
  },

  /** Listening sessions: plays separated by less than the session gap. */
  sessions(i0, i1) {
    return this.memo('ses' + i0 + ':' + i1, () => {
      const c = this.cols(), gap = Settings.get('sessionGapMin') * 60000;
      const list = [];
      let cur = null;
      for (let i = i0; i < i1; i++) {
        const start = c.T[i], end = start + c.MS[i];
        if (cur && start - cur.end <= gap) {
          cur.end = Math.max(cur.end, end); cur.plays += c.CNT[i]; cur.i1 = i + 1;
        } else {
          if (cur) list.push(cur);
          cur = { start, end, plays: c.CNT[i], i0: i, i1: i + 1 };
        }
      }
      if (cur) list.push(cur);
      const lens = list.map(s => s.end - s.start);
      const total = lens.reduce((a, b) => a + b, 0);
      let longest = null;
      for (const s of list) if (!longest || s.end - s.start > longest.end - longest.start) longest = s;
      const buckets = [0, 0, 0, 0, 0, 0]; // <15m, <30m, <1h, <2h, <4h, 4h+
      for (const l of lens) {
        const m = l / 60000;
        buckets[m < 15 ? 0 : m < 30 ? 1 : m < 60 ? 2 : m < 120 ? 3 : m < 240 ? 4 : 5]++;
      }
      // Songs that most often open a session.
      const openers = new Map();
      for (const s of list) openers.set(c.TR[s.i0], (openers.get(c.TR[s.i0]) || 0) + 1);
      return { count: list.length, avg: list.length ? total / list.length : 0, longest, buckets, openers: topN(openers, 10, v => v) };
    });
  },

  /** Cumulative minutes by day of year, one series per calendar year in range. */
  yearCompare(i0, i1) {
    return this.memo('yc' + i0 + ':' + i1, () => {
      const c = this.cols(), years = new Map();
      for (let i = i0; i < i1; i++) {
        const d = dayDate(c.DAY[i]);
        const y = d.getUTCFullYear();
        let arr = years.get(y);
        if (!arr) years.set(y, arr = new Float64Array(366));
        const doy = Math.floor((Date.UTC(y, d.getUTCMonth(), d.getUTCDate()) - Date.UTC(y, 0, 1)) / DAY);
        arr[doy] += c.MS[i];
      }
      const today = new Date();
      const out = [];
      for (const [y, arr] of [...years].sort((a, b) => a[0] - b[0])) {
        const len = y === today.getFullYear() ? Math.floor((Date.UTC(y, today.getMonth(), today.getDate()) - Date.UTC(y, 0, 1)) / DAY) + 1
          : (y % 4 === 0 ? 366 : 365);
        const vals = new Array(len);
        let acc = 0;
        for (let d = 0; d < len; d++) { acc += arr[d]; vals[d] = acc / 3600000; }
        out.push({ year: y, values: vals });
      }
      return out;
    });
  },

  /* ---------- tops ---------- */

  /** kind: 'track' | 'artist' | 'album'. Returns [{id, plays, ms}] sorted by metric. */
  top(i0, i1, kind, metric = 'plays', filter) {
    const key = 'top' + [i0, i1, kind, metric, filter ? filter.key : ''];
    return this.memo(key, () => {
      const c = this.cols();
      const col = kind === 'track' ? c.TR : kind === 'artist' ? c.AR : c.AL;
      const size = kind === 'track' ? Store.tracks.length : kind === 'artist' ? Store.artists.length : Store.albums.length;
      const plays = new Float64Array(size), ms = new Float64Array(size);
      for (let i = i0; i < i1; i++) {
        const id = col[i];
        if (id < 0) continue;
        if (filter && !filter.test(i)) continue;
        plays[id] += c.CNT[i]; ms[id] += c.MS[i];
      }
      const out = [];
      for (let id = 0; id < size; id++) if (plays[id] || ms[id]) out.push({ id, plays: plays[id], ms: ms[id] });
      out.sort(metric === 'ms' ? (a, b) => b.ms - a.ms : (a, b) => b.plays - a.plays || b.ms - a.ms);
      return out;
    });
  },
  rankMap(i0, i1, kind, metric) {
    return this.memo('rank' + [i0, i1, kind, metric], () => {
      const m = new Map();
      this.top(i0, i1, kind, metric).forEach((x, i) => m.set(x.id, i + 1));
      return m;
    });
  },

  /* ---------- per-entity index (all time) ---------- */

  /** For each track (or artist), the indexes of its plays, in time order. CSR layout. */
  byEntity(kind) {
    return this.memo('by' + kind, () => {
      const c = this.cols();
      const col = kind === 'track' ? c.TR : c.AR;
      const size = kind === 'track' ? Store.tracks.length : Store.artists.length;
      const start = new Uint32Array(size + 1);
      for (let i = 0; i < c.n; i++) start[col[i] + 1]++;
      for (let k = 0; k < size; k++) start[k + 1] += start[k];
      const fill = start.slice(0, size);
      const idx = new Uint32Array(c.n);
      for (let i = 0; i < c.n; i++) idx[fill[col[i]]++] = i;
      return { start, idx };
    });
  },
  entityPlays(kind, id) {
    const b = this.byEntity(kind);
    return b.idx.subarray(b.start[id], b.start[id + 1]);
  },

  /** First counted play of every track and artist (all time). */
  firsts() {
    return this.memo('firsts', () => {
      const c = this.cols();
      const tr = new Float64Array(Store.tracks.length).fill(Infinity);
      const ar = new Float64Array(Store.artists.length).fill(Infinity);
      const trI = new Int32Array(Store.tracks.length).fill(-1);
      for (let i = 0; i < c.n; i++) {
        if (!c.CNT[i]) continue;
        if (tr[c.TR[i]] === Infinity) { tr[c.TR[i]] = c.T[i]; trI[c.TR[i]] = i; }
        if (ar[c.AR[i]] === Infinity) ar[c.AR[i]] = c.T[i];
      }
      return { tr, ar, trI };
    });
  },

  /** New artists and songs per month (first ever play inside the period). */
  discoveries(i0, i1) {
    return this.memo('disc' + i0 + ':' + i1, () => {
      const c = this.cols(), f = this.firsts();
      if (i1 <= i0) return { keys: [], artists: [], tracks: [], newArtists: [], newTracks: [] };
      const from = c.T[i0], to = c.T[i1 - 1];
      const k0 = monthKeyOfDay(c.DAY[i0]), k1 = monthKeyOfDay(c.DAY[i1 - 1]);
      const keys = [];
      for (let k = k0; k <= k1; k++) keys.push(k);
      const artists = new Array(keys.length).fill(0), tracks = new Array(keys.length).fill(0);
      const monthOfT = t => monthKeyOfDay(dayNum(t)) - k0;
      const newArtists = [], newTracks = [];
      f.ar.forEach((t, id) => { if (t >= from && t <= to) { artists[monthOfT(t)]++; newArtists.push(id); } });
      f.tr.forEach((t, id) => { if (t >= from && t <= to) { tracks[monthOfT(t)]++; newTracks.push(id); } });
      // Rank the new ones by how much they were played in the period.
      const ap = this.top(i0, i1, 'artist'), tp = this.top(i0, i1, 'track');
      const aSet = new Set(newArtists), tSet = new Set(newTracks);
      return {
        keys, artists, tracks,
        newArtists: ap.filter(x => aSet.has(x.id)), newTracks: tp.filter(x => tSet.has(x.id)),
      };
    });
  },

  /** Times of the 1st, 10th, 50th … counted play of a track or artist. */
  milestones(kind, id) {
    const c = this.cols(), idx = this.entityPlays(kind, id);
    const marks = [1, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
    const out = [];
    let n = 0, mi = 0;
    for (const i of idx) {
      if (!c.CNT[i]) continue;
      n++;
      if (n === marks[mi]) { out.push({ n, t: c.T[i] }); mi++; }
    }
    return out;
  },

  /**
   * "Obsessions": songs with an intense 30-day peak that later faded.
   * Score = plays in the best 30 days; faded = in the 180 days after, under a quarter of that.
   */
  obsessions(i0, i1) {
    return this.memo('obs' + i0 + ':' + i1, () => {
      const c = this.cols(), b = this.byEntity('track');
      if (i1 <= i0) return [];
      const from = c.T[i0], to = c.T[i1 - 1];
      const out = [];
      for (let id = 0; id < Store.tracks.length; id++) {
        const n = b.start[id + 1] - b.start[id];
        if (n < 12) continue;
        const idx = b.idx.subarray(b.start[id], b.start[id + 1]);
        const ts = [];
        for (const i of idx) if (c.CNT[i]) ts.push(c.T[i]);
        if (ts.length < 12) continue;
        let best = 0, bestStart = 0, j = 0;
        for (let k = 0; k < ts.length; k++) {
          while (ts[k] - ts[j] > 30 * DAY) j++;
          if (k - j + 1 > best) { best = k - j + 1; bestStart = ts[j]; }
        }
        if (best < 10 || bestStart < from || bestStart > to) continue;
        const peakEnd = bestStart + 30 * DAY;
        let after = 0;
        for (const t of ts) if (t > peakEnd && t <= peakEnd + 180 * DAY) after++;
        const total = ts.length;
        out.push({ id, peak: best, peakStart: bestStart, after, total, faded: after < best / 4 && peakEnd + 180 * DAY < Date.now() });
      }
      out.sort((a, b) => b.peak - a.peak);
      return out;
    });
  },

  /** Songs that came back after at least a year of silence (return inside the period). */
  comebacks(i0, i1) {
    return this.memo('cb' + i0 + ':' + i1, () => {
      const c = this.cols(), b = this.byEntity('track');
      if (i1 <= i0) return [];
      const from = c.T[i0], to = c.T[i1 - 1];
      const out = [];
      for (let id = 0; id < Store.tracks.length; id++) {
        const idx = b.idx.subarray(b.start[id], b.start[id + 1]);
        if (idx.length < 4) continue;
        let prev = -1, before = 0;
        for (let k = 0; k < idx.length; k++) {
          const i = idx[k];
          if (!c.CNT[i]) continue;
          const t = c.T[i];
          if (prev >= 0 && t - prev >= 365 * DAY && t >= from && t <= to) {
            let after = 0;
            for (let m = k; m < idx.length && c.T[idx[m]] - t < 90 * DAY; m++) after += c.CNT[idx[m]];
            if (after >= 2) out.push({ id, gap: t - prev, back: t, before, after });
          }
          prev = t; before++;
        }
      }
      out.sort((a, b) => b.gap - a.gap);
      return out;
    });
  },

  /** Per calendar year: variety of listening. */
  diversity(i0, i1) {
    return this.memo('div' + i0 + ':' + i1, () => {
      const c = this.cols(), f = this.firsts();
      const years = new Map();
      for (let i = i0; i < i1; i++) {
        if (!c.CNT[i]) continue;
        const y = dayDate(c.DAY[i]).getUTCFullYear();
        let v = years.get(y);
        if (!v) years.set(y, v = { plays: 0, art: new Map(), tr: new Set(), newPlays: 0 });
        v.plays++;
        v.art.set(c.AR[i], (v.art.get(c.AR[i]) || 0) + 1);
        v.tr.add(c.TR[i]);
        if (new Date(f.ar[c.AR[i]]).getFullYear() === y) v.newPlays++;
      }
      return [...years].sort((a, b) => a[0] - b[0]).map(([y, v]) => {
        const counts = [...v.art.values()].sort((a, b) => b - a);
        let acc = 0, half = 0;
        for (const x of counts) { acc += x; half++; if (acc >= v.plays / 2) break; }
        const top10 = counts.slice(0, 10).reduce((a, b) => a + b, 0);
        return { year: y, plays: v.plays, artists: v.art.size, tracks: v.tr.size, half, top10Share: top10 / v.plays, newShare: v.newPlays / v.plays };
      });
    });
  },

  /** Share of the top artists per month (or year), the rest folded into "other". */
  artistShare(i0, i1, nTop = 6) {
    return this.memo('share' + [i0, i1, nTop], () => {
      const c = this.cols();
      if (i1 <= i0) return null;
      const byYear = c.DAY[i1 - 1] - c.DAY[i0] > 4 * 365;
      const bucket = d => byYear ? dayDate(d).getUTCFullYear() : monthKeyOfDay(d);
      const k0 = bucket(c.DAY[i0]), k1 = bucket(c.DAY[i1 - 1]);
      const tops = this.top(i0, i1, 'artist').slice(0, nTop).map(x => x.id);
      const slot = new Map(tops.map((id, k) => [id, k]));
      const n = k1 - k0 + 1;
      const vals = Array.from({ length: nTop + 1 }, () => new Float64Array(n));
      const tot = new Float64Array(n);
      for (let i = i0; i < i1; i++) {
        if (!c.CNT[i]) continue;
        const b = bucket(c.DAY[i]) - k0;
        const s = slot.has(c.AR[i]) ? slot.get(c.AR[i]) : nTop;
        vals[s][b]++; tot[b]++;
      }
      const series = vals.map((v, k) => ({
        name: k < tops.length ? Store.artists[tops[k]].n : 'Остали',
        values: Array.from(v, (x, j) => tot[j] ? x / tot[j] : 0),
      })).filter((s, k) => k < tops.length || k === nTop);
      const labels = [];
      for (let k = k0; k <= k1; k++) labels.push(byYear ? String(k) : monthKeyLabel(k));
      const short = [];
      for (let k = k0; k <= k1; k++) short.push(byYear ? String(k) : (k % 12 === 0 ? String(Math.floor(k / 12)) : MONTHS_SHORT[k % 12]));
      return { labels, short, series, totals: Array.from(tot) };
    });
  },

  /** Frames for the bar chart race: cumulative plays per artist (or track), month by month. */
  race(i0, i1, kind = 'artist', nTop = 10) {
    return this.memo('race' + [i0, i1, kind], () => {
      const c = this.cols();
      if (i1 <= i0) return [];
      const col = kind === 'track' ? c.TR : c.AR;
      const acc = new Map();
      const frames = [];
      let curKey = monthKeyOfDay(c.DAY[i0]);
      const snap = k => {
        const top = topN(acc, nTop, v => v).map(([id, v]) => ({ id, v }));
        frames.push({ label: monthKeyLabel(k), items: top });
      };
      for (let i = i0; i < i1; i++) {
        const k = monthKeyOfDay(c.DAY[i]);
        while (k > curKey) { snap(curKey); curKey++; }
        if (c.CNT[i]) acc.set(col[i], (acc.get(col[i]) || 0) + 1);
      }
      snap(curKey);
      return frames;
    });
  },

  /* ---------- habits (need the JSON export: skips, shuffle, platform, country) ---------- */

  habits(i0, i1) {
    return this.memo('hab' + i0 + ':' + i1, () => {
      const c = this.cols();
      const R = Store.reasons;
      const fwd = R.indexOf('fwdbtn'), done = R.indexOf('trackdone');
      let json = 0, skipped = 0, shuffle = 0, offline = 0, incognito = 0, completed = 0;
      const plat = new Map(), country = new Map(), rs = new Map(), re = new Map();
      const years = new Map();
      const trSkip = new Map(), arSkip = new Map();
      for (let i = i0; i < i1; i++) {
        if (!(c.F[i] & SRC_JSON)) continue;
        json++;
        const f = c.F[i];
        const isSkip = (f & F_SKIPPED) || (fwd > 0 && c.RE[i] === fwd);
        if (isSkip) skipped++;
        if (f & F_SHUFFLE) shuffle++;
        if (f & F_OFFLINE) offline++;
        if (f & F_INCOGNITO) incognito++;
        if (done > 0 && c.RE[i] === done) completed++;
        if (c.P[i]) plat.set(c.P[i], (plat.get(c.P[i]) || 0) + c.MS[i]);
        if (c.C[i]) country.set(c.C[i], (country.get(c.C[i]) || 0) + 1);
        if (c.RS[i]) rs.set(c.RS[i], (rs.get(c.RS[i]) || 0) + 1);
        if (c.RE[i]) re.set(c.RE[i], (re.get(c.RE[i]) || 0) + 1);
        const y = dayDate(c.DAY[i]).getUTCFullYear();
        let yv = years.get(y);
        if (!yv) years.set(y, yv = { n: 0, skip: 0, shuffle: 0, offline: 0, plat: new Map() });
        yv.n++; if (isSkip) yv.skip++; if (f & F_SHUFFLE) yv.shuffle++; if (f & F_OFFLINE) yv.offline++;
        if (c.P[i]) yv.plat.set(c.P[i], (yv.plat.get(c.P[i]) || 0) + c.MS[i]);
        let ts = trSkip.get(c.TR[i]);
        if (!ts) trSkip.set(c.TR[i], ts = [0, 0]);
        ts[0]++; if (isSkip) ts[1]++;
        let as = arSkip.get(c.AR[i]);
        if (!as) arSkip.set(c.AR[i], as = [0, 0]);
        as[0]++; if (isSkip) as[1]++;
      }
      const rate = (m, min) => [...m].filter(([, v]) => v[0] >= min).map(([id, v]) => ({ id, n: v[0], skip: v[1], rate: v[1] / v[0] }));
      const trRates = rate(trSkip, 8);
      const arRates = rate(arSkip, 20);
      return {
        json, skipped, shuffle, offline, incognito, completed,
        platforms: [...plat].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ name: Store.platforms[k], ms: v })),
        countries: [...country].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ code: Store.countries[k], n: v })),
        reasonStart: [...rs].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ name: Store.reasons[k], n: v })),
        reasonEnd: [...re].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ name: Store.reasons[k], n: v })),
        years: [...years].sort((a, b) => a[0] - b[0]).map(([y, v]) => ({ year: y, n: v.n, skip: v.skip / v.n, shuffle: v.shuffle / v.n, offline: v.offline / v.n, plat: v.plat })),
        mostSkipped: trRates.slice().sort((a, b) => b.rate - a.rate || b.n - a.n).slice(0, 25),
        neverSkipped: trRates.slice().sort((a, b) => a.rate - b.rate || b.n - a.n).slice(0, 25),
        artistSkips: arRates.sort((a, b) => b.rate - a.rate).slice(0, 25),
      };
    });
  },

  /** Share of plays by artist group (tags), per year. */
  groups(i0, i1) {
    return this.memo('grp' + i0 + ':' + i1 + JSON.stringify(Settings.get('tagNames')), () => {
      const c = this.cols(), tags = Settings.get('tagNames');
      const years = new Map();
      for (let i = i0; i < i1; i++) {
        if (!c.CNT[i]) continue;
        const y = dayDate(c.DAY[i]).getUTCFullYear();
        let v = years.get(y);
        if (!v) years.set(y, v = { n: 0, tags: new Array(tags.length).fill(0) });
        v.n++;
        const at = Store.artists[c.AR[i]].tags;
        if (at && at.length) tags.forEach((tg, k) => { if (at.includes(tg)) v.tags[k]++; });
      }
      return { tags, years: [...years].sort((a, b) => a[0] - b[0]).map(([y, v]) => ({ year: y, n: v.n, shares: v.tags.map(x => x / v.n) })) };
    });
  },

  /* ---------- summaries ---------- */

  /** The busiest single days, and the most repeats of one song in a day. */
  records(i0, i1) {
    return this.memo('rec' + i0 + ':' + i1, () => {
      const c = this.cols();
      const days = [...this.days(i0, i1)].sort((a, b) => b[1].ms - a[1].ms);
      let rep = { n: 0, id: -1, day: 0 };
      let curDay = -1;
      const cnt = new Map();
      const flush = () => { for (const [id, n] of cnt) if (n > rep.n) rep = { n, id, day: curDay }; cnt.clear(); };
      for (let i = i0; i < i1; i++) {
        if (c.DAY[i] !== curDay) { flush(); curDay = c.DAY[i]; }
        if (c.CNT[i]) cnt.set(c.TR[i], (cnt.get(c.TR[i]) || 0) + 1);
      }
      flush();
      const months = this.series(i0, i1, 'month');
      let bestM = -1;
      months.ms.forEach((v, k) => { if (bestM < 0 || v > months.ms[bestM]) bestM = k; });
      const hw = this.hourWeek(i0, i1, 'ms');
      const hours = new Array(24).fill(0), wdays = new Array(7).fill(0);
      hw.forEach((row, w) => row.forEach((v, hh) => { hours[hh] += v; wdays[w] += v; }));
      return {
        topDays: days.slice(0, 10).map(([d, v]) => ({ day: d, ms: v.ms, plays: v.plays })),
        repeat: rep,
        bestMonth: bestM >= 0 ? { label: months.labels[bestM], ms: months.ms[bestM] } : null,
        bestHour: hours.indexOf(Math.max(...hours)),
        bestWeekday: wdays.indexOf(Math.max(...wdays)),
        hours, wdays,
      };
    });
  },
};

/* ---------- charts.js: small SVG/HTML chart kit ----------
Marks follow one spec: bars ≤ 24px with a 4px rounded data end, 2px lines, recessive hairline
grid, categorical colors in fixed order (--c1…--c8), sequential blue ramp (--q0…--q6) for heat.
Every chart has a hover/touch tooltip; values also appear in lists/tables next to the charts.
*/

const Tip = {
  el: null,
  show(rows, x, y) {
    if (!this.el) this.el = document.body.appendChild(h('div.tip'));
    clear(this.el);
    for (const r of rows) {
      if (typeof r === 'string') this.el.appendChild(h('div.tip-title', r));
      else this.el.appendChild(h('div.tip-row', r.color ? h('span.tip-key', { style: { background: r.color } }) : null,
        h('b', r.value), r.label ? h('span', r.label) : null));
    }
    this.el.style.display = 'block';
    const w = this.el.offsetWidth, hh = this.el.offsetHeight;
    const vw = document.documentElement.clientWidth;
    let left = x - w / 2;
    left = Math.max(8, Math.min(vw - w - 8, left));
    let top = y - hh - 14;
    if (top < 8) top = y + 18;
    this.el.style.left = left + 'px';
    this.el.style.top = top + 'px';
  },
  hide() { if (this.el) this.el.style.display = 'none'; },
};
document.addEventListener('scroll', () => Tip.hide(), true);

const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)', 'var(--c8)'];
const OTHER_COLOR = 'var(--c-other)';

function niceTicks(max, count = 4) {
  if (!(max > 0)) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = [];
  for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}

function chartBox(container, height) {
  clear(container);
  container.classList.add('chart');
  const W = Math.max(260, container.clientWidth || 320);
  const svg = s('svg', { width: W, height, viewBox: `0 0 ${W} ${height}`, role: 'img' });
  container.appendChild(svg);
  return { W, H: height, svg };
}

function yAxis(svg, ticks, x0, x1, yOf, fmt) {
  const g = s('g', { class: 'axis' });
  for (const t of ticks) {
    const y = Math.round(yOf(t)) + 0.5;
    g.appendChild(s('line', { x1: x0, x2: x1, y1: y, y2: y, class: t === 0 ? 'baseline' : 'grid' }));
    g.appendChild(s('text', { x: x0 - 6, y: y + 4, 'text-anchor': 'end' }, fmt(t)));
  }
  svg.appendChild(g);
}

function xLabels(svg, labels, xOf, y, W, minGap = 56) {
  const g = s('g', { class: 'axis' });
  let lastX = -Infinity;
  const n = labels.length;
  const step = Math.max(1, Math.ceil(n / Math.max(1, Math.floor((W - 40) / minGap))));
  for (let i = 0; i < n; i += step) {
    const x = xOf(i);
    if (x - lastX < minGap * 0.8) continue;
    g.appendChild(s('text', { x, y, 'text-anchor': 'middle' }, labels[i]));
    lastX = x;
  }
  svg.appendChild(g);
}

function barPath(x, y, w, h0, r) {
  // Rounded top (data end), square at the baseline.
  if (h0 <= 0) return '';
  r = Math.min(r, w / 2, h0);
  return `M${x},${y + h0}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h0}Z`;
}

/**
 * Time series: columns when they fit, otherwise an area line.
 * opts: {labels (short axis labels), full (tooltip labels), values, fmt, height, color, onPick(i)}
 */
function chartSeries(container, opts) {
  const { labels, values } = opts;
  const full = opts.full || labels;
  const fmt = opts.fmt || fmtInt;
  const height = opts.height || 190;
  const { W, H, svg } = chartBox(container, height);
  const L = 44, R = 10, T = 12, B = 24;
  const n = values.length;
  const max = Math.max(0, ...values);
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1] || 1;
  const pw = W - L - R, ph = H - T - B;
  const yOf = v => T + ph - (v / top) * ph;
  yAxis(svg, ticks, L, W - R, yOf, v => opts.axisFmt ? opts.axisFmt(v) : fmtCompact(v));
  const band = pw / Math.max(1, n);
  const xOf = i => L + band * (i + 0.5);
  const color = opts.color || COLORS[0];
  const asBars = band >= 4;
  const marks = [];
  if (asBars) {
    const bw = Math.min(24, Math.max(2, band - 2));
    const g = s('g');
    values.forEach((v, i) => {
      const y = yOf(v);
      const p = s('path', { d: barPath(xOf(i) - bw / 2, y, bw, T + ph - y, bw >= 8 ? 4 : 1), style: `fill:${color}`, class: 'mark' });
      g.appendChild(p);
      marks.push(p);
    });
    svg.appendChild(g);
  } else {
    let d = '';
    values.forEach((v, i) => { d += (i ? 'L' : 'M') + xOf(i).toFixed(1) + ',' + yOf(v).toFixed(1); });
    svg.appendChild(s('path', { d: d + `L${xOf(n - 1)},${T + ph}L${xOf(0)},${T + ph}Z`, style: `fill:${color};opacity:.14` }));
    svg.appendChild(s('path', { d, class: 'line', style: `stroke:${color}` }));
  }
  xLabels(svg, labels, xOf, H - 6, W);
  // Hover layer: the whole plot, snapping to the nearest bucket.
  const cross = s('line', { class: 'cross', y1: T, y2: T + ph, x1: -10, x2: -10 });
  const dot = s('circle', { r: 4, class: 'dot', cx: -10, cy: -10, style: `fill:${color}` });
  if (!asBars) { svg.appendChild(cross); svg.appendChild(dot); }
  const hit = s('rect', { x: L, y: T, width: pw, height: ph + B, class: 'hit' });
  svg.appendChild(hit);
  let active = -1;
  const pick = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left - L) / band)));
    if (i !== active) {
      if (active >= 0 && marks[active]) marks[active].classList.remove('on');
      active = i;
      if (marks[i]) marks[i].classList.add('on');
    }
    if (!asBars) {
      cross.setAttribute('x1', xOf(i)); cross.setAttribute('x2', xOf(i));
      dot.setAttribute('cx', xOf(i)); dot.setAttribute('cy', yOf(values[i]));
    }
    Tip.show([full[i], { value: fmt(values[i]) }], r.left + xOf(i), r.top + yOf(values[i]));
    return i;
  };
  hit.addEventListener('pointermove', pick);
  hit.addEventListener('pointerdown', pick);
  hit.addEventListener('pointerleave', () => {
    Tip.hide();
    if (active >= 0 && marks[active]) marks[active].classList.remove('on');
    cross.setAttribute('x1', -10); cross.setAttribute('x2', -10); dot.setAttribute('cx', -10);
    active = -1;
  });
  if (opts.onPick) hit.addEventListener('click', e => opts.onPick(pick(e)));
}

/** Several lines on one axis. opts: {series: [{name, values, color}], labelOf(i), xLabels: [{i, text}], fmt, height} */
function chartLines(container, opts) {
  const height = opts.height || 220;
  const wrap = container;
  clear(wrap);
  if (opts.series.length > 1) wrap.appendChild(legend(opts.series.map((sr, k) => ({ name: sr.name, color: sr.color || COLORS[k % 8], line: true }))));
  const holder = wrap.appendChild(h('div'));
  const { W, H, svg } = chartBox(holder, height);
  const L = 44, R = 36, T = 12, B = 24;
  const n = Math.max(...opts.series.map(sr => sr.values.length));
  const max = Math.max(0, ...opts.series.map(sr => Math.max(0, ...sr.values)));
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1] || 1;
  const pw = W - L - R, ph = H - T - B;
  const xOf = i => L + (n > 1 ? (i / (n - 1)) * pw : pw / 2);
  const yOf = v => T + ph - (v / top) * ph;
  const fmt = opts.fmt || fmtInt;
  yAxis(svg, ticks, L, W - R, yOf, v => fmtCompact(v));
  const g = s('g', { class: 'axis' });
  for (const xl of opts.xLabels || []) g.appendChild(s('text', { x: xOf(xl.i), y: H - 6, 'text-anchor': 'middle' }, xl.text));
  svg.appendChild(g);
  opts.series.forEach((sr, k) => {
    const color = sr.color || COLORS[k % 8];
    let d = '';
    sr.values.forEach((v, i) => { d += (i ? 'L' : 'M') + xOf(i).toFixed(1) + ',' + yOf(v).toFixed(1); });
    svg.appendChild(s('path', { d, class: 'line', style: `stroke:${color}` }));
    const last = sr.values.length - 1;
    if (last >= 0) {
      svg.appendChild(s('circle', { cx: xOf(last), cy: yOf(sr.values[last]), r: 4, class: 'dot', style: `fill:${color}` }));
      if (opts.endLabels) svg.appendChild(s('text', { x: xOf(last) + 7, y: yOf(sr.values[last]) + 4, class: 'endlabel' }, sr.name));
    }
  });
  const cross = s('line', { class: 'cross', y1: T, y2: T + ph, x1: -10, x2: -10 });
  svg.appendChild(cross);
  const hit = s('rect', { x: L, y: T, width: pw, height: ph, class: 'hit' });
  svg.appendChild(hit);
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left - L) / pw) * (n - 1))));
    cross.setAttribute('x1', xOf(i)); cross.setAttribute('x2', xOf(i));
    const rows = [opts.labelOf ? opts.labelOf(i) : String(i)];
    opts.series.forEach((sr, k) => {
      if (i < sr.values.length) rows.push({ color: sr.color || COLORS[k % 8], value: fmt(sr.values[i]), label: sr.name });
    });
    Tip.show(rows, r.left + xOf(i), e.clientY - 10);
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { Tip.hide(); cross.setAttribute('x1', -10); cross.setAttribute('x2', -10); });
}

/** 100% stacked area. opts: {labels, short, series: [{name, values (shares)}]} */
function chartShare(container, opts) {
  clear(container);
  const series = opts.series;
  const colorOf = k => (series[k].name === 'Остали' ? OTHER_COLOR : COLORS[k % 8]);
  container.appendChild(legend(series.map((sr, k) => ({ name: sr.name, color: colorOf(k) }))));
  const holder = container.appendChild(h('div'));
  const { W, H, svg } = chartBox(holder, opts.height || 220);
  const L = 36, R = 10, T = 8, B = 24;
  const n = opts.labels.length;
  const pw = W - L - R, ph = H - T - B;
  const xOf = i => L + (n > 1 ? (i / (n - 1)) * pw : pw / 2);
  const yOf = v => T + ph - v * ph;
  yAxis(svg, [0, 0.25, 0.5, 0.75, 1], L, W - R, yOf, v => Math.round(v * 100) + '%');
  const base = new Array(n).fill(0);
  series.forEach((sr, k) => {
    const lower = base.slice();
    const upper = base.map((b, i) => b + sr.values[i]);
    let d = '';
    for (let i = 0; i < n; i++) d += (i ? 'L' : 'M') + xOf(i).toFixed(1) + ',' + yOf(upper[i]).toFixed(1);
    for (let i = n - 1; i >= 0; i--) d += 'L' + xOf(i).toFixed(1) + ',' + yOf(lower[i]).toFixed(1);
    svg.appendChild(s('path', { d: d + 'Z', class: 'area', style: `fill:${colorOf(k)}` }));
    for (let i = 0; i < n; i++) base[i] = upper[i];
  });
  xLabels(svg, opts.short, xOf, H - 6, W);
  const cross = s('line', { class: 'cross', y1: T, y2: T + ph, x1: -10, x2: -10 });
  svg.appendChild(cross);
  const hit = s('rect', { x: L, y: T, width: pw, height: ph, class: 'hit' });
  svg.appendChild(hit);
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left - L) / pw) * (n - 1))));
    cross.setAttribute('x1', xOf(i)); cross.setAttribute('x2', xOf(i));
    const rows = [opts.labels[i]];
    series.forEach((sr, k) => rows.push({ color: colorOf(k), value: fmtPct(sr.values[i]), label: sr.name }));
    Tip.show(rows, r.left + xOf(i), e.clientY - 10);
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { Tip.hide(); cross.setAttribute('x1', -10); cross.setAttribute('x2', -10); });
}

function legend(items) {
  return h('div.legend', items.map(it => h('span.legend-item',
    h('span', { class: it.line ? 'key-line' : 'key-box', style: { background: it.color } }), it.name)));
}

/** Sequential color step 0…6 for a value relative to max (0 = empty). */
function heatStep(v, max) {
  if (!v || !max) return 0;
  return Math.max(1, Math.min(6, Math.ceil((v / max) * 6)));
}
function heatLegend(max, fmt) {
  return h('div.heat-legend', h('span', 'мање'), [1, 2, 3, 4, 5, 6].map(k => h('i', { style: { background: `var(--q${k})` } })), h('span', 'више'));
}

/** Weekday × hour heat map. m: 7×24 values. */
function chartHourWeek(container, m, fmt) {
  clear(container);
  container.classList.add('chart');
  const max = Math.max(...m.map(r => Math.max(...r)));
  const grid = h('div.hw');
  grid.appendChild(h('span'));
  for (let hh = 0; hh < 24; hh++) grid.appendChild(h('span.hw-h', hh % 3 === 0 ? String(hh) : ''));
  m.forEach((row, w) => {
    grid.appendChild(h('span.hw-d', WEEKDAYS_SHORT[w]));
    row.forEach((v, hh) => {
      const cell = h('span.hw-c', { style: { background: `var(--q${heatStep(v, max)})` } });
      const show = e => {
        const r = cell.getBoundingClientRect();
        Tip.show([WEEKDAYS[w] + ', ' + hh + ':00–' + (hh + 1) + ':00', { value: fmt(v) }], r.left + r.width / 2, r.top);
      };
      cell.addEventListener('pointerenter', show);
      cell.addEventListener('pointerdown', show);
      cell.addEventListener('pointerleave', () => Tip.hide());
      grid.appendChild(cell);
    });
  });
  container.appendChild(grid);
  container.appendChild(heatLegend());
}

/** Calendar for one year: 12 rows (months) × 31 columns (days). dayMap: Map(day → {plays, ms}). */
function chartCalendar(container, year, dayMap, metric, onDay) {
  clear(container);
  container.classList.add('chart');
  let max = 0;
  const vals = [];
  for (let m = 0; m < 12; m++) {
    const row = [];
    const days = new Date(year, m + 1, 0).getDate();
    for (let d = 1; d <= 31; d++) {
      if (d > days) { row.push(null); continue; }
      const dn = Math.floor(Date.UTC(year, m, d) / DAY);
      const v = dayMap.get(dn);
      const x = v ? (metric === 'ms' ? v.ms : v.plays) : 0;
      if (x > max) max = x;
      row.push({ dn, x });
    }
    vals.push(row);
  }
  const grid = h('div.cal');
  grid.appendChild(h('span'));
  for (let d = 1; d <= 31; d++) grid.appendChild(h('span.cal-h', d % 5 === 0 || d === 1 ? String(d) : ''));
  vals.forEach((row, m) => {
    grid.appendChild(h('span.cal-m', MONTHS_SHORT[m]));
    row.forEach(c => {
      if (!c) { grid.appendChild(h('span.cal-x')); return; }
      const wd = weekdayOfDay(c.dn);
      const cell = h('span.cal-c' + (wd >= 5 ? '.we' : ''), { style: { background: `var(--q${heatStep(c.x, max)})` } });
      const show = () => {
        const r = cell.getBoundingClientRect();
        Tip.show([WEEKDAYS[wd] + ', ' + fmtDay(c.dn), { value: metric === 'ms' ? fmtDur(c.x) : countOf(c.x, 'слушање', 'слушања', 'слушања') }], r.left + r.width / 2, r.top);
      };
      cell.addEventListener('pointerenter', show);
      cell.addEventListener('pointerdown', show);
      cell.addEventListener('pointerleave', () => Tip.hide());
      if (onDay) cell.addEventListener('click', () => onDay(c.dn));
      grid.appendChild(cell);
    });
  });
  container.appendChild(grid);
  container.appendChild(heatLegend());
}

/** A single 100% bar split into parts, with a legend list under it. items: [{name, value}] */
function chartSplit(container, items, fmt) {
  clear(container);
  const total = items.reduce((a, b) => a + b.value, 0) || 1;
  const shown = items.slice(0, 7);
  const rest = items.slice(7).reduce((a, b) => a + b.value, 0);
  if (rest) shown.push({ name: 'Остало', value: rest, other: true });
  const bar = h('div.split');
  shown.forEach((it, k) => {
    const seg = h('span', { style: { flexGrow: it.value, background: it.other ? OTHER_COLOR : COLORS[k % 8] } });
    const show = () => {
      const r = seg.getBoundingClientRect();
      Tip.show([it.name, { value: fmtPct(it.value / total), label: fmt(it.value) }], r.left + r.width / 2, r.top);
    };
    seg.addEventListener('pointerenter', show);
    seg.addEventListener('pointerdown', show);
    seg.addEventListener('pointerleave', () => Tip.hide());
    bar.appendChild(seg);
  });
  container.appendChild(bar);
  container.appendChild(h('div.split-list', shown.map((it, k) => h('div.split-row',
    h('span.key-box', { style: { background: it.other ? OTHER_COLOR : COLORS[k % 8] } }),
    h('span.grow', it.name), h('b', fmtPct(it.value / total)), h('span.muted', fmt(it.value))))));
}

/** Horizontal histogram bars (HTML). items: [{label, value, sub}] */
function chartHBars(container, items, fmt, color) {
  clear(container);
  const max = Math.max(...items.map(i => i.value), 1);
  container.appendChild(h('div.hbars', items.map(it => h('div.hbar',
    h('span.hbar-label', it.label),
    h('span.hbar-track', h('span.hbar-fill', { style: { width: (it.value / max * 100) + '%', background: color || COLORS[0] } })),
    h('span.hbar-val', fmt(it.value))))));
}

/**
 * Bar chart race: frames [{label, items: [{id, v}]}], nameOf(id), subOf(id).
 * Rows are absolutely positioned and slide to their rank; the bar widths animate.
 */
function chartRace(container, frames, nameOf, subOf) {
  clear(container);
  if (!frames.length) return;
  const ROW = 30, N = Math.max(...frames.map(f => f.items.length));
  const colorOf = new Map();
  let nextColor = 0;
  const title = h('div.race-label');
  const stage = h('div.race', { style: { height: (N * ROW) + 'px' } });
  const rows = new Map();
  const slider = h('input.race-slider', { type: 'range', min: 0, max: frames.length - 1, value: 0 });
  const btn = h('button.btn.small', '▶ Пусти');
  let k = 0, timer = null;
  const render = () => {
    const f = frames[k];
    title.textContent = f.label;
    slider.value = k;
    const max = f.items.length ? f.items[0].v : 1;
    const seen = new Set();
    f.items.forEach((it, rank) => {
      seen.add(it.id);
      let row = rows.get(it.id);
      if (!row) {
        if (!colorOf.has(it.id)) colorOf.set(it.id, COLORS[nextColor++ % 8]);
        row = h('div.race-row', h('span.race-bar', { style: { background: colorOf.get(it.id) } }),
          h('span.race-name', nameOf(it.id)), h('span.race-val'));
        row.style.transform = `translateY(${N * ROW}px)`;
        stage.appendChild(row);
        rows.set(it.id, row);
      }
      row.style.opacity = 1;
      row.style.transform = `translateY(${rank * ROW}px)`;
      row.firstChild.style.width = Math.max(2, (it.v / max) * 100) + '%';
      row.lastChild.textContent = fmtInt(it.v);
    });
    for (const [id, row] of rows) if (!seen.has(id)) { row.style.opacity = 0; row.style.transform = `translateY(${N * ROW}px)`; }
  };
  const stop = () => { clearInterval(timer); timer = null; btn.textContent = '▶ Пусти'; };
  btn.addEventListener('click', () => {
    if (timer) return stop();
    if (k >= frames.length - 1) k = 0;
    btn.textContent = '⏸ Стани';
    timer = setInterval(() => {
      if (!container.isConnected) return stop();
      if (k >= frames.length - 1) return stop();
      k++;
      render();
    }, frames.length > 80 ? 350 : 600);
  });
  slider.addEventListener('input', () => { stop(); k = +slider.value; render(); });
  container.appendChild(h('div.race-top', title, btn));
  container.appendChild(stage);
  container.appendChild(slider);
  k = frames.length - 1;
  render();
}

/* ---------- ui.js: shared components (rows, tiles, covers, sheets, toasts) and the period ---------- */

function toast(msg, isError) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' err' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.className = ''; }, isError ? 5000 : 2600);
}

function card(title, ...children) {
  return h('section.card', title ? h('h3.card-title', title) : null, children);
}
function cardNote(text) { return h('p.note', text); }
function tile(label, value, sub) {
  return h('div.tile', h('div.tile-label', label), h('div.tile-value', value), sub ? h('div.tile-sub', sub) : null);
}
function tiles(...items) { return h('div.tiles', items); }
function empty(text) { return h('div.empty', text); }

/** Segmented control. options: [[value, label]], onChange(value). */
function seg(options, value, onChange) {
  const el = h('div.seg', { role: 'tablist' });
  for (const [v, label] of options) {
    el.appendChild(h('button' + (v === value ? '.on' : ''), {
      type: 'button', role: 'tab', 'aria-selected': v === value ? 'true' : 'false',
      onclick: () => { if (v !== value) onChange(v); },
    }, label));
  }
  return el;
}

function btn(label, onClick, cls = '') {
  return h('button.btn' + (cls ? '.' + cls.split(' ').join('.') : ''), { type: 'button', onclick: onClick }, label);
}
/** Runs an async action with the button disabled and errors shown as a toast. */
function busyBtn(label, action, cls) {
  const b = btn(label, async () => {
    if (b.disabled) return;
    b.disabled = true;
    const old = b.textContent;
    b.textContent = '…';
    try { await action(b); } catch (e) { console.error(e); toast(e.message || String(e), true); }
    finally { b.disabled = false; if (b.textContent === '…') b.textContent = old; }
  }, cls);
  return b;
}

function initials(name) {
  const w = (name || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
function artistImg(artistId) {
  const a = Store.artists[artistId];
  if (a.img) return a.img;
  const m = Stats.memo('artImg', () => {
    const map = new Map();
    const top = Stats.top(0, Stats.cols().n, 'track');
    for (const x of top) {
      const t = Store.tracks[x.id];
      if (t.img && !map.has(t.a)) map.set(t.a, t.img);
    }
    return map;
  });
  return m.get(artistId) || '';
}
/** Cover image for a track / album / artist; fetched lazily from Spotify when missing. */
function cover(kind, id, size = 44) {
  let url = '', name = '';
  if (kind === 'track') { const t = Store.tracks[id]; url = t.img || ''; name = t.n; }
  else if (kind === 'album') { const al = Store.albums[id]; url = al.img || ''; name = al.n; }
  else { url = artistImg(id); name = Store.artists[id].n; }
  const el = h('span.cover' + (kind === 'artist' ? '.round' : ''), { style: { width: size + 'px', height: size + 'px' } });
  const setImg = u => {
    clear(el);
    const img = h('img', { src: u, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
    img.onerror = () => { clear(el); el.appendChild(h('span.cover-txt', initials(name))); };
    el.appendChild(img);
  };
  if (url) setImg(url);
  else {
    el.appendChild(h('span.cover-txt', initials(name)));
    if (kind === 'track') Covers.want(id, u => u && el.isConnected && setImg(u));
    else if (kind === 'album') {
      const tid = Store.tracks.findIndex(t => t.al === id && t.uri);
      if (tid >= 0) Covers.want(tid, u => u && el.isConnected && setImg(u));
    }
  }
  return el;
}

function entityName(kind, id) {
  if (kind === 'track') return cleanTitle(Store.tracks[id].n);
  if (kind === 'album') return Store.albums[id].n;
  return Store.artists[id].n;
}
function entitySub(kind, id) {
  if (kind === 'track') return Store.artists[Store.tracks[id].a].n;
  if (kind === 'album') return Store.artists[Store.albums[id].a].n;
  return '';
}

/**
 * List row: rank · cover · title/sub · value (+ bar). onClick opens detail.
 * opts: {rank, kind, id, title, sub, value, frac, right (element), onClick}
 */
function row(opts) {
  const el = h('div.row' + (opts.onClick ? '.click' : ''), { onclick: opts.onClick || null });
  if (opts.rank != null) el.appendChild(h('span.rank', String(opts.rank)));
  if (opts.kind) el.appendChild(cover(opts.kind, opts.id));
  const mid = h('span.row-mid', h('span.row-title', opts.title), opts.sub ? h('span.row-sub', opts.sub) : null);
  if (opts.frac != null) mid.appendChild(h('span.row-bar', h('span', { style: { width: Math.max(1, opts.frac * 100) + '%' } })));
  el.appendChild(mid);
  if (opts.value != null) el.appendChild(h('span.row-val', opts.value));
  if (opts.right) el.appendChild(opts.right);
  return el;
}
function entityRow(kind, x, rank, max, metric) {
  const v = metric === 'ms' ? x.ms : x.plays;
  return row({
    rank, kind, id: x.id, title: entityName(kind, x.id), sub: entitySub(kind, x.id),
    value: metric === 'ms' ? fmtDur(x.ms) : fmtInt(x.plays), frac: max ? v / max : 0,
    onClick: () => App.openDetail(kind, x.id),
  });
}
/** A list that shows `step` rows and grows on "Прикажи још". */
function growList(items, makeRow, step = 25) {
  const wrap = h('div.list');
  let shown = 0;
  const more = btn('Прикажи још', () => add(), 'ghost wide');
  const add = () => {
    const next = items.slice(shown, shown + step);
    next.forEach((x, k) => wrap.insertBefore(makeRow(x, shown + k), more));
    shown += next.length;
    more.style.display = shown < items.length ? '' : 'none';
  };
  wrap.appendChild(more);
  add();
  return wrap;
}
