}

  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; background: var(--bg);
  padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
}
.ov-title { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-body { max-width: 760px; margin: 0 auto; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

  background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto;
  padding: 6px 16px calc(18px + env(safe-area-inset-bottom));
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 16px; }

<script>
'use strict';
/* ---------- util.js: DOM helpers, formatting, dates, name normalization ---------- */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** h('div.card', {onclick}, child, 'text', [children]) — tiny element builder; text is always textContent. */
function h(tag, attrs, ...children) {
  const m = /^([a-z0-9]+)?((?:\.[\w-]+)*)(?:#([\w-]+))?$/i.exec(tag);
  const el = document.createElement(m[1] || 'div');
  if (m[2]) el.className = m[2].slice(1).replace(/\./g, ' ');
  if (m[3]) el.id = m[3];
  if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) {
    children.unshift(attrs);
    attrs = null;
  }
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className += (el.className ? ' ' : '') + v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'html') el.innerHTML = v; // only for trusted, static markup (icons)
      else if (k in el && k !== 'list' && k !== 'type') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  appendAll(el, children);
  return el;
}
function appendAll(el, children) {
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) appendAll(el, c);
    else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  for (const c of children) if (c != null) el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

/* ---------- numbers ---------- */

const nfInt = new Intl.NumberFormat('sr-Latn-RS', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('sr-Latn-RS', { maximumFractionDigits: 1 });
function fmtInt(n) { return nfInt.format(Math.round(n || 0)); }
function fmt1(n) { return nf1.format(n || 0); }
function fmtCompact(n) {
  n = n || 0;
  const a = Math.abs(n);
  if (a >= 1e6) return nf1.format(n / 1e6) + ' мил';
  if (a >= 1e4) return nfInt.format(n / 1e3) + ' хиљ';
  return fmtInt(n);
}
function fmtPct(x, digits = 0) {
  if (!isFinite(x)) return '–';
  return (x * 100).toFixed(digits).replace('.', ',') + '%';
}
/** Milliseconds as "12 ч 5 мин" / "42 мин" / "35 с". */
function fmtDur(ms) {
  ms = ms || 0;
  const min = ms / 60000;
  if (min < 1) return Math.round(ms / 1000) + ' с';
  if (min < 60) return Math.round(min) + ' мин';
  const hrs = Math.floor(min / 60);
  if (hrs < 48) return hrs + ' ч ' + Math.round(min - hrs * 60) + ' мин';
  const days = Math.floor(hrs / 24);
  return fmtInt(days) + ' д ' + (hrs - days * 24) + ' ч';
}
function fmtHours(ms) { return fmtInt(ms / 3600000); }
function fmtMin(ms) { return fmtInt(ms / 60000); }
function fmtClock(ms) {
  const sec = Math.round(ms / 1000);
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

/** Serbian plural: plural(5, 'песма', 'песме', 'песама'). */
function plural(n, one, few, many) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}
function countOf(n, one, few, many) { return fmtInt(n) + ' ' + plural(Math.round(n), one, few, many); }

/* ---------- dates (all stats use the phone's local time) ---------- */

const DAY = 86400000;
const MONTHS = ['јануар', 'фебруар', 'март', 'април', 'мај', 'јун', 'јул', 'август', 'септембар', 'октобар', 'новембар', 'децембар'];
const MONTHS_SHORT = ['јан', 'феб', 'мар', 'апр', 'мај', 'јун', 'јул', 'авг', 'сеп', 'окт', 'нов', 'дец'];
const WEEKDAYS = ['понедељак', 'уторак', 'среда', 'четвртак', 'петак', 'субота', 'недеља'];
const WEEKDAYS_SHORT = ['пон', 'уто', 'сре', 'чет', 'пет', 'суб', 'нед'];
const WEEKDAYS_ON = ['понедељком', 'уторком', 'средом', 'четвртком', 'петком', 'суботом', 'недељом'];

/** Local day number (days since 1970-01-01 in local time). */
function dayNum(t) {
  const d = new Date(t);
  return Math.floor((t - d.getTimezoneOffset() * 60000) / DAY);
}
/** Start of a local day number, as ms. */
function dayStart(n) {
  const d = new Date(n * DAY);
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()).getTime();
}
function dayDate(n) { return new Date(n * DAY); } // read with getUTC*
/** Monday = 0 … Sunday = 6. */
function weekdayOfDay(n) { return (n + 3) % 7; }
function monthKeyOfDay(n) { const d = dayDate(n); return d.getUTCFullYear() * 12 + d.getUTCMonth(); }
function monthKeyLabel(k, short) {
  const y = Math.floor(k / 12), m = k % 12;
  return short ? MONTHS_SHORT[m] + ' ' + String(y).slice(2) : MONTHS[m] + ' ' + y;
}
function monthKeyStart(k) { return new Date(Math.floor(k / 12), k % 12, 1).getTime(); }
function fmtDay(n, withYear = true) {
  const d = dayDate(n);
  return d.getUTCDate() + '. ' + MONTHS[d.getUTCMonth()] + (withYear ? ' ' + d.getUTCFullYear() + '.' : '');
}
function fmtDate(t, withTime) {
  if (!t) return '–';
  const d = new Date(t);
  let s = d.getDate() + '. ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear() + '.';
  if (withTime) s += ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return s;
}
function fmtAgo(t) {
  const d = Date.now() - t;
  if (d < 60000) return 'малопре';
  if (d < 3600000) return 'пре ' + Math.round(d / 60000) + ' мин';
  if (d < DAY) return 'пре ' + Math.round(d / 3600000) + ' ч';
  return fmtDate(t);
}
function isoDate(t) {
  const d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ---------- name normalization (matching the same song across sources) ---------- */

const CYR = {
  а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', ђ: 'dj', е: 'e', ж: 'z', з: 'z', и: 'i', ј: 'j', к: 'k', л: 'l', љ: 'lj',
  м: 'm', н: 'n', њ: 'nj', о: 'o', п: 'p', р: 'r', с: 's', т: 't', ћ: 'c', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'c',
  џ: 'dz', ш: 's', й: 'j', ы: 'y', э: 'e', ю: 'ju', я: 'ja', ь: '', ъ: '', ё: 'e', є: 'e', і: 'i', ї: 'i', ґ: 'g', щ: 'sc',
};
function foldText(str) {
  let out = '';
  for (const ch of str.toLowerCase()) out += CYR[ch] !== undefined ? CYR[ch] : ch;
  return out.replace(/đ/g, 'dj').replace(/ß/g, 'ss').replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/ł/g, 'l')
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}
// Suffixes that name the same recording: "- Remastered 2011", "(feat. X)", "- Radio Edit", "[Mono]" …
const VERSION_WORDS = /\b(remaster(ed)?|re-?master(ed)?|mono|stereo|radio edit|single version|album version|original mix|original version|explicit|clean|bonus track|deluxe|anniversary|edit(ion)?|mixed|digital(ly)?|\d{4} (mix|version|remaster))\b/;
function normTitle(t) {
  let x = foldText(t || '');
  x = x.replace(/[([{]\s*(feat\.?|ft\.?|featuring|with)\s[^)\]}]*[)\]}]/g, ' ');
  x = x.replace(/\s(feat\.?|ft\.?|featuring)\s.*$/, ' ');
  // Bracketed version notes.
  x = x.replace(/[([{]([^)\]}]*)[)\]}]/g, (all, inner) => (VERSION_WORDS.test(inner) ? ' ' : ' ' + inner + ' '));
  // " - Remastered 2009", " - Mono" …
  x = x.replace(/\s[-–—]\s(.*)$/, (all, tail) => (VERSION_WORDS.test(tail) ? ' ' : ' ' + tail));
  return x.replace(/&/g, ' and ').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}
function normArtist(a) {
  let x = foldText(a || '');
  x = x.replace(/\s(feat\.?|ft\.?|featuring)\s.*$/, '');
  x = x.replace(/^the\s/, '');
  return x.replace(/&/g, ' and ').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}
/** Title for display: drops "- Remastered 2011" style notes (the name stays the same song either way). */
function cleanTitle(t) {
  return (t || '').replace(/\s+[-–]\s+(\d{4}\s+)?(digital(ly)?\s+)?remaster(ed)?(\s+\d{4})?(\s+version)?$/i, '')
    .replace(/\s*[([](\d{4}\s+)?(digital(ly)?\s+)?remaster(ed)?[^)\]]*[)\]]/i, '').trim() || t;
}
function trackKey(artist, title) { return normArtist(artist) + '\u0001' + normTitle(title); }

/* ---------- misc ---------- */

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
/** First index i in sorted array/typed array `arr` with arr[i] >= x. */
function lowerBound(arr, x, lo = 0, hi = arr.length) {
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] < x) lo = mid + 1; else hi = mid;
  }
  return lo;
}
function topN(map, n, score) {
  const arr = [];
  for (const [k, v] of map) arr.push([k, v]);
  arr.sort((a, b) => score(b[1]) - score(a[1]));
  return arr.slice(0, n);
}
function randomString(len) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const v = crypto.getRandomValues(new Uint8Array(len));
  let out = '';
  for (let i = 0; i < len; i++) out += chars[v[i] % chars.length];
  return out;
}
function b64url(bytes) {
  let bin = '';
  const b = new Uint8Array(bytes);
  for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function bytesToBase64(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
}
function spotifyIdFromUri(uri) { return uri && uri.startsWith('spotify:track:') ? uri.slice(14) : null; }
function spotifyOpenUrl(uri) {
  if (!uri) return null;
  const p = uri.split(':');
  return p.length === 3 ? 'https://open.spotify.com/' + p[1] + '/' + p[2] : null;
}
function lsGet(k, def) {
  try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ }
}

/* ---------- store.js: the local database of plays, tracks, artists and albums ----------

Every play from every source lands here, once:
  - Spotify JSON export (Extended streaming history, or the short account data history),
  - Spotify "recently played" (in the app and from the Android background job),
  - Last.fm scrobbles.

Rules for duplicates (see mergePlays):
  1. The JSON export is the most complete source. For the time it covers, it replaces the
     other sources: their plays inside that time are dropped.
  2. Outside that time, Spotify and Last.fm plays of the same song within 5 minutes of each
     other are one play (each source can "claim" a play only once, so repeats stay separate).
  3. Importing the same data twice changes nothing.
*/

const SRC_JSON = 1, SRC_API = 2, SRC_LFM = 4, SRC_MASK = 7;
const F_SHUFFLE = 8, F_SKIPPED = 16, F_OFFLINE = 32, F_INCOGNITO = 64;
const MATCH_WINDOW = 5 * 60000;
const COVERAGE_GAP = 7 * DAY;

const DB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('slusaonica', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks');
      };
      req.onsuccess = () => { DB.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  },
  tx(stores, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = DB.db.transaction(stores, mode);
      let out;
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('aborted'));
      out = fn(t);
    });
  },
  get(store, key) {
    return new Promise((resolve, reject) => {
      const r = DB.db.transaction(store).objectStore(store).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  getAll(store) {
    return new Promise((resolve, reject) => {
      const r = DB.db.transaction(store).objectStore(store).getAll();
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  put(store, key, value) {
    return DB.tx([store], 'readwrite', t => { t.objectStore(store).put(value, key); });
  },
};

const Store = {
  tracks: [],      // {n: name, a: artist id, al: album id, uri, dur, img}
  artists: [],     // {n: name, tags: [], img, uri}
  albums: [],      // {n: name, a: artist id, img}
  trackByKey: new Map(),
  artistByKey: new Map(),
  albumByKey: new Map(),
  rawCache: new Map(),
  plays: [],      // sorted by t: {t: start ms, ms: played ms or -1, tr, f, p, c, rs, re}
  platforms: [''], countries: [''], reasons: [''],
  coverage: [],    // [[from, to], …] times covered by the JSON export
  meta: {},        // sync cursors and import history
  version: 0,      // bumped on every change; stats caches key on it
  dictDirty: false,

  async load() {
    await DB.open();
    const dict = await DB.get('kv', 'dict');
    if (dict) {
      Object.assign(this, {
        tracks: dict.tracks, artists: dict.artists, albums: dict.albums,
        platforms: dict.platforms, countries: dict.countries, reasons: dict.reasons,
      });
    }
    this.coverage = (await DB.get('kv', 'coverage')) || [];
    this.meta = (await DB.get('kv', 'meta')) || {};
    this.rebuildKeys();
    const chunks = await DB.getAll('chunks');
    const plays = [];
    for (const c of chunks) {
      for (let i = 0; i < c.t.length; i++) {
        plays.push({ t: c.t[i], ms: c.ms[i], tr: c.tr[i], f: c.f[i], p: c.p[i], c: c.c[i], rs: c.rs[i], re: c.re[i] });
      }
    }
    plays.sort((a, b) => a.t - b.t);
    this.plays = plays;
    this.version++;
  },

  rebuildKeys() {
    this.rawCache = new Map();
    this.trackByKey = new Map();
    this.artistByKey = new Map();
    this.albumByKey = new Map();
    this.artists.forEach((a, i) => this.artistByKey.set(normArtist(a.n), i));
    this.albums.forEach((al, i) => this.albumByKey.set(al.a + '|' + foldText(al.n), i));
    this.tracks.forEach((t, i) => this.trackByKey.set(t.a + '|' + normTitle(t.n), i));
  },

  isEmpty() { return this.plays.length === 0; },

  /* ---------- dictionaries ---------- */

  artistId(name) {
    const k = normArtist(name) || '?';
    let id = this.artistByKey.get(k);
    if (id === undefined) {
      id = this.artists.length;
      this.artists.push({ n: name || '?', tags: [] });
      this.artistByKey.set(k, id);
      this.dictDirty = true;
    }
    return id;
  },
  albumId(artistId, name) {
    if (!name) return -1;
    const k = artistId + '|' + foldText(name);
    let id = this.albumByKey.get(k);
    if (id === undefined) {
      id = this.albums.length;
      this.albums.push({ n: name, a: artistId });
      this.albumByKey.set(k, id);
      this.dictDirty = true;
    }
    return id;
  },
  /** Finds or creates the track for {name, artist, album, uri, dur, img}; fills in missing details. */
  trackId(info) {
    // Normalizing names is the slow part of a big import; the same raw names repeat a lot.
    const raw = info.artist + '\u0002' + info.name;
    let id = this.rawCache.get(raw);
    let a, t;
    if (id === undefined) {
      a = this.artistId(info.artist);
      id = this.trackByKey.get(a + '|' + normTitle(info.name));
    } else {
      a = this.tracks[id].a;
    }
    if (id === undefined) {
      const k = a + '|' + normTitle(info.name);
      id = this.tracks.length;
      t = { n: info.name || '?', a, al: this.albumId(a, info.album) };
      this.tracks.push(t);
      this.trackByKey.set(k, id);
      this.dictDirty = true;
    } else {
      t = this.tracks[id];
      if (t.al < 0 && info.album) { t.al = this.albumId(a, info.album); this.dictDirty = true; }
    }
    this.rawCache.set(raw, id);
    if (info.uri && !t.uri && info.uri.startsWith('spotify:track:')) { t.uri = info.uri; this.dictDirty = true; }
    if (info.dur && !t.dur) { t.dur = info.dur; this.dictDirty = true; }
    if (info.img && !t.img) {
      t.img = info.img;
      if (t.al >= 0 && !this.albums[t.al].img) this.albums[t.al].img = info.img;
      this.dictDirty = true;
    }
    return id;
  },
  strId(table, value) {
    if (!value) return 0;
    let i = table.indexOf(value);
    if (i < 0) {
      if (table.length >= 255) return 0;
      i = table.length;
      table.push(value);
      this.dictDirty = true;
    }
    return i;
  },

  /* ---------- plays ---------- */

  inCoverage(t) {
    for (const [a, b] of this.coverage) if (t >= a && t <= b) return true;
    return false;
  },
  /** Index of the first play with start time >= t. */
  lb(t) {
    const p = this.plays;
    let lo = 0, hi = p.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (p[mid].t < t) lo = mid + 1; else hi = mid;
    }
    return lo;
  },

  /**
   * Adds plays from one source. items: {t (start ms), ms (played ms, or -1 if unknown), name, artist,
   * album, uri, dur, img, flags, platform, country, reasonStart, reasonEnd}.
   * JSON items also carry `file` (their source file) for coverage.
   * Returns {added, merged, skipped}.
   */
  async mergePlays(src, items) {
    const res = { added: 0, merged: 0, skipped: 0 };
    if (!items.length) return res;
    const dirty = new Set();
    const pending = [];
    const pendingKeys = new Set();

    if (src === SRC_JSON) {
      // Coverage: one interval per file, joined when the gap between them is small.
      const byFile = new Map();
      for (const it of items) {
        const end = it.t + Math.max(0, it.ms);
        const r = byFile.get(it.file);
        if (!r) byFile.set(it.file, [it.t, end]);
        else { if (it.t < r[0]) r[0] = it.t; if (end > r[1]) r[1] = end; }
      }
      const cov = this.coverage.concat([...byFile.values()]).sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const r of cov) {
        const last = merged[merged.length - 1];
        if (last && r[0] - last[1] <= COVERAGE_GAP) last[1] = Math.max(last[1], r[1]);
        else merged.push([r[0], r[1]]);
      }
      this.coverage = merged;
      // Other sources give way inside the covered time.
      const keep = [];
      for (const p of this.plays) {
        if (!(p.f & SRC_JSON) && this.inCoverage(p.t)) { dirty.add(monthOf(p.t)); continue; }
        keep.push(p);
      }
      this.plays = keep;
    }

    for (const it of items) {
      if (src !== SRC_JSON && this.inCoverage(it.t)) { res.skipped++; continue; }
      const tr = this.trackId(it);
      const i0 = this.lb(it.t - MATCH_WINDOW);
      let best = null, bestD = Infinity, dup = false;
      for (let i = i0; i < this.plays.length; i++) {
        const p = this.plays[i];
        if (p.t > it.t + MATCH_WINDOW) break;
        if (p.tr !== tr) continue;
        const d = Math.abs(p.t - it.t);
        if (p.f & src) {
          // The same play from the same source (re-import or overlapping fetch).
          if (d < (src === SRC_JSON ? 2000 : 90000)) { dup = true; break; }
        } else if (src !== SRC_JSON && d < bestD) {
          best = p; bestD = d;
        }
      }
      const pk = tr + ':' + Math.round(it.t / 1000);
      if (dup || pendingKeys.has(pk)) { res.skipped++; continue; }
      if (best) {
        best.f |= src;
        dirty.add(monthOf(best.t));
        res.merged++;
        continue;
      }
      pendingKeys.add(pk);
      pending.push({
        t: it.t, ms: it.ms == null ? -1 : it.ms, tr, f: src | (it.flags || 0),
        p: this.strId(this.platforms, it.platform), c: this.strId(this.countries, it.country),
        rs: this.strId(this.reasons, it.reasonStart), re: this.strId(this.reasons, it.reasonEnd),
      });
      dirty.add(monthOf(it.t));
      res.added++;
    }
    if (pending.length) {
      this.plays = this.plays.concat(pending);
      this.plays.sort((a, b) => a.t - b.t);
    }
    if (dirty.size || this.dictDirty || src === SRC_JSON) {
      this.version++;
      await this.save(src === SRC_JSON ? null : dirty);
    }
    return res;
  },

  /** Removes everything one source added (plays that other sources also have stay). */
  async removeSource(src) {
    const keep = [];
    for (const p of this.plays) {
      p.f &= ~src;
      if (p.f & SRC_MASK) keep.push(p);
    }
    this.plays = keep;
    if (src === SRC_JSON) this.coverage = [];
    if (src === SRC_LFM) delete this.meta.lastfm;
    if (src === SRC_API) delete this.meta.recent;
    if (src === SRC_JSON) delete this.meta.imports;
    this.version++;
    await this.save(null);
  },

  async wipe() {
    Object.assign(this, {
      tracks: [], artists: [], albums: [], plays: [], coverage: [], meta: {},
      platforms: [''], countries: [''], reasons: [''],
    });
    this.rebuildKeys();
    this.version++;
    await this.save(null);
  },

  /** Writes the dictionaries and the given months (a Set of 'YYYY-MM'), or every month when null. */
  async save(months) {
    const byMonth = new Map();
    for (const p of this.plays) {
      const k = monthOf(p.t);
      if (months && !months.has(k)) continue;
      let arr = byMonth.get(k);
      if (!arr) byMonth.set(k, arr = []);
      arr.push(p);
    }
    if (months) for (const k of months) if (!byMonth.has(k)) byMonth.set(k, []);
    const dict = {
      tracks: this.tracks, artists: this.artists, albums: this.albums,
      platforms: this.platforms, countries: this.countries, reasons: this.reasons,
    };
    await DB.tx(['kv', 'chunks'], 'readwrite', t => {
      const kv = t.objectStore('kv');
      kv.put(dict, 'dict');
      kv.put(this.coverage, 'coverage');
      kv.put(this.meta, 'meta');
      const ch = t.objectStore('chunks');
      if (!months) ch.clear();
      for (const [k, arr] of byMonth) {
        if (!arr.length) { ch.delete(k); continue; }
        ch.put(packChunk(arr), k);
      }
    });
    this.dictDirty = false;
  },
  async saveMeta() { await DB.put('kv', 'meta', this.meta); },
  async saveDict() {
    await DB.put('kv', 'dict', {
      tracks: this.tracks, artists: this.artists, albums: this.albums,
      platforms: this.platforms, countries: this.countries, reasons: this.reasons,
    });
    this.dictDirty = false;
  },

  /* ---------- backup ---------- */

  snapshot() {
    return {
      app: 'slusaonica', version: 1, exported: Date.now(),
      dict: {
        tracks: this.tracks, artists: this.artists, albums: this.albums,
        platforms: this.platforms, countries: this.countries, reasons: this.reasons,
      },
      coverage: this.coverage, meta: this.meta,
      plays: {
        t: this.plays.map(p => p.t), ms: this.plays.map(p => p.ms), tr: this.plays.map(p => p.tr),
        f: this.plays.map(p => p.f), p: this.plays.map(p => p.p), c: this.plays.map(p => p.c),
        rs: this.plays.map(p => p.rs), re: this.plays.map(p => p.re),
      },
    };
  },
  async restore(data) {
    if (!data || data.app !== 'slusaonica' || !data.plays) throw new Error('Ово није бекап Слушаонице');
    const d = data.dict, P = data.plays;
    Object.assign(this, {
      tracks: d.tracks, artists: d.artists, albums: d.albums,
      platforms: d.platforms, countries: d.countries, reasons: d.reasons,
      coverage: data.coverage || [], meta: data.meta || {},
    });
    const plays = [];
    for (let i = 0; i < P.t.length; i++) {
      plays.push({ t: P.t[i], ms: P.ms[i], tr: P.tr[i], f: P.f[i], p: P.p[i], c: P.c[i], rs: P.rs[i], re: P.re[i] });
    }
    plays.sort((a, b) => a.t - b.t);
    this.plays = plays;
    this.rebuildKeys();
    this.version++;
    await this.save(null);
  },
};

function monthOf(t) { return new Date(t).toISOString().slice(0, 7); }

function packChunk(arr) {
  const n = arr.length;
  const c = {
    t: new Float64Array(n), ms: new Int32Array(n), tr: new Int32Array(n), f: new Uint16Array(n),
    p: new Uint8Array(n), c: new Uint8Array(n), rs: new Uint8Array(n), re: new Uint8Array(n),
  };
  arr.forEach((p, i) => {
    c.t[i] = p.t; c.ms[i] = p.ms; c.tr[i] = p.tr; c.f[i] = p.f; c.p[i] = p.p; c.c[i] = p.c; c.rs[i] = p.rs; c.re[i] = p.re;
  });
  return c;
}
