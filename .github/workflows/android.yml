name: Android APK

on:
  push:
    branches: ['**']
    paths: ['index.html', 'src/**', 'tools/**', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # index.html is generated from src/; the app downloads it from main, so it must be committed up to date.
      - name: Check index.html is built from src/
        run: node tools/build.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Signing key from repository secrets (see README). Without them the APK is signed with a
      # throwaway key: it installs, but the next build cannot update it in place.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: the APK is signed with a temporary key and cannot update an installed copy."
          fi

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Build APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../slusaonica.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slusaonica-apk
          path: slusaonica.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/slusaonica.apk
      # The tag's last number is the app's versionCode (the run number, see android/app/build.gradle):
      # the in-app update check compares it with the installed version.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" slusaonica.apk \
            --title "Слушаоница 1.0.${{ github.run_number }}" \
            --notes "Android build of commit ${{ github.sha }}. Download slusaonica.apk below and open it on your phone to install or update."
